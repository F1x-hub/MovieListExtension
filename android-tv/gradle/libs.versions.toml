# Owned by the coordinator. Worker sessions ask for a new dependency instead of editing this file.
[versions]
agp = "9.1.1"
kotlin = "2.3.21"
compileSdk = "37"
minSdk = "26"
targetSdk = "35"

composeBom = "2026.09.00"
