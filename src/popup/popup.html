<!DOCTYPE html>
<html lang="en" class="popup-document">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rating Extension</title>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <script defer src="../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../shared/styles/theme.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="stylesheet" href="../shared/styles/navigation.css">
    <link rel="stylesheet" href="../shared/styles/popup.css">
    <link rel="stylesheet" href="../shared/styles/overflow-fixes.css">
    <script src="../shared/services/ThemeService.js"></script>
    <script src="../shared/services/SeasonalThemeService.js"></script>
</head>
<body class="popup-page">
    <script src="theme-init.js"></script>
    <div class="popup-container">
        <!-- Update Banner -->
        <div id="updateBanner" class="update-banner" style="display: none;" role="status" aria-live="polite">
            <div class="update-content">
                <span class="update-icon"><svg data-icon="UPDATE" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3H14A3 3 0 0 1 17 6V14A3 3 0 0 1 14 17H6A3 3 0 0 1 3 14V6A3 3 0 0 1 6 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 13.4V7M7.2 9.8L10 7L12.8 9.8"/></svg></span>
                <div class="update-text">
                    <span class="update-title" data-i18n="popup.update.title">Update Available</span>
                    <span class="update-version" id="updateVersion" data-i18n="popup.update.version">New version ready</span>
                    <span class="update-status" id="updateStatus"></span>
                </div>
            </div>
            <div class="update-actions">
                <button id="updateBtn" class="btn-update" data-i18n="popup.update.btn">Update</button>
                <button id="dismissUpdateBtn" class="btn-dismiss" aria-label="Dismiss update" data-i18n="[aria-label]popup.update.dismiss"><svg data-icon="CLOSE" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5L15 15M15 5L5 15"/></svg></button>
            </div>
        </div>

        <!-- Header -->
        <header class="popup-header">
            <div class="popup-title-container">
                <a href="../pages/home/home.html" class="popup-logo" id="popupLogo" data-seasonal-logo="popup-logo-mark" title="Go to Home" aria-label="Go to Home" data-i18n="[aria-label]popup.header.home">
                    <img src="../shared/assets/icons/app/icon48-white.png" alt="" class="popup-logo-img" aria-hidden="true">
                </a>
                <h1 class="popup-title" data-i18n="popup.header.title">Movie Ratings</h1>
            </div>
            <div class="header-actions-group" id="headerActionsGroup" style="display: none;">
                <button type="button" id="refreshBtn" class="btn-icon-header" title="Refresh" data-i18n="[aria-label]popup.content.refresh" aria-label="Refresh">
                    <svg data-icon="REFRESH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9A7 7 0 0 1 15.6 5.6L17 7M17 3V7H13M17 11A7 7 0 0 1 4.4 14.4L3 13M3 17V13H7"/></svg>
                </button>
                <button type="button" id="openFullBtn" class="btn-icon-header" title="Open Full Page" data-i18n="[aria-label]popup.content.view_all" aria-label="Open Full Page">
                    <svg data-icon="EXTERNAL" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6A2 2 0 0 0 4 7V14A2 2 0 0 0 6 16H13A2 2 0 0 0 15 14V12M9 11L14 6"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M11.4 2H17A1 1 0 0 1 18 3V8.6A.6 .6 0 0 1 17 9L11 3A.6 .6 0 0 1 11.4 2Z"/></svg>
                </button>
                <div class="avatar-container" id="avatarContainer">
                    <button type="button" id="userAvatarBtn" class="avatar-btn" aria-label="Account menu" data-i18n="[aria-label]popup.header.user_menu" aria-expanded="false" aria-controls="avatarDropdown">
                        <img id="userAvatar" class="user-avatar" src="" alt="" aria-hidden="true" style="display: none;">
                        <span id="userAvatarFallback" class="avatar-fallback"><svg data-icon="USER" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 2A4 4 0 1 0 10 10A4 4 0 1 0 10 2Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 12C13.6 12 16 13.8 16.6 16.2C16.7 16.7 16.4 17 15.9 17H4.1C3.6 17 3.3 16.7 3.4 16.2C4 13.8 6.4 12 10 12Z"/></svg></span>
                    </button>
                    <!-- Account actions -->
                    <div id="avatarDropdown" class="popover-surface avatar-dropdown" hidden inert>
                        <div class="avatar-dropdown-header">
                            <span id="userName" class="dropdown-username">User</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button type="button" id="profileMenuBtn" class="dropdown-item">
                            <svg data-icon="USER" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 2A4 4 0 1 0 10 10A4 4 0 1 0 10 2Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 12C13.6 12 16 13.8 16.6 16.2C16.7 16.7 16.4 17 15.9 17H4.1C3.6 17 3.3 16.7 3.4 16.2C4 13.8 6.4 12 10 12Z"/></svg>
                            <span data-i18n="popup.content.profile">Мой профиль</span>
                        </button>
                        <button type="button" id="settingsBtn" class="dropdown-item">
                            <svg data-icon="SETTINGS" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10.58 1.22C10.96 1.25 11.41 1.12 11.58 2.04C11.76 2.97 11.88 3.57 12.13 3.71C12.39 3.85 12.66 3.96 12.94 4.04C13.22 4.13 13.73 3.78 14.51 3.25C15.29 2.73 15.51 3.14 15.8 3.38C16.1 3.63 16.37 3.9 16.62 4.2C16.86 4.49 17.27 4.71 16.75 5.49C16.22 6.27 15.87 6.78 15.96 7.06C16.04 7.34 16.15 7.61 16.29 7.87C16.43 8.12 17.03 8.24 17.96 8.42C18.88 8.59 18.75 9.04 18.78 9.42C18.82 9.81 18.82 10.19 18.78 10.58C18.75 10.96 18.88 11.41 17.96 11.58C17.03 11.76 16.43 11.88 16.29 12.13C16.15 12.39 16.04 12.66 15.96 12.94C15.87 13.22 16.22 13.73 16.75 14.51C17.27 15.29 16.86 15.51 16.62 15.8C16.37 16.1 16.1 16.37 15.8 16.62C15.51 16.86 15.29 17.27 14.51 16.75C13.73 16.22 13.22 15.87 12.94 15.96C12.66 16.04 12.39 16.15 12.13 16.29C11.88 16.43 11.76 17.03 11.58 17.96C11.41 18.88 10.96 18.75 10.58 18.78C10.19 18.82 9.81 18.82 9.42 18.78C9.04 18.75 8.59 18.88 8.42 17.96C8.24 17.03 8.12 16.43 7.87 16.29C7.61 16.15 7.34 16.04 7.06 15.96C6.78 15.87 6.27 16.22 5.49 16.75C4.71 17.27 4.49 16.86 4.2 16.62C3.9 16.37 3.63 16.1 3.38 15.8C3.14 15.51 2.73 15.29 3.25 14.51C3.78 13.73 4.13 13.22 4.04 12.94C3.96 12.66 3.85 12.39 3.71 12.13C3.57 11.88 2.97 11.76 2.04 11.58C1.12 11.41 1.25 10.96 1.22 10.58C1.18 10.19 1.18 9.81 1.22 9.42C1.25 9.04 1.12 8.59 2.04 8.42C2.97 8.24 3.57 8.12 3.71 7.87C3.85 7.61 3.96 7.34 4.04 7.06C4.13 6.78 3.78 6.27 3.25 5.49C2.73 4.71 3.14 4.49 3.38 4.2C3.63 3.9 3.9 3.63 4.2 3.38C4.49 3.14 4.71 2.73 5.49 3.25C6.27 3.78 6.78 4.13 7.06 4.04C7.34 3.96 7.61 3.85 7.87 3.71C8.12 3.57 8.24 2.97 8.42 2.04C8.59 1.12 9.04 1.25 9.42 1.22C9.81 1.18 10.19 1.18 10.58 1.22ZM10 6.8A3.2 3.2 0 1 0 10 13.2A3.2 3.2 0 1 0 10 6.8Z"/></svg>
                            <span data-i18n="popup.content.settings">Настройки</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button type="button" id="logoutBtn" class="dropdown-item logout-item">
                            <svg data-icon="LOGOUT" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3H6A3 3 0 0 0 3 6V14A3 3 0 0 0 6 17H8M9 10H17M13.6 6.4L17.2 10L13.6 13.6"/></svg>
                            <span data-i18n="popup.content.logout">Выйти из аккаунта</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="auth-status" id="authStatus" role="status" aria-live="polite">
                <span id="statusText" data-i18n="popup.header.not_authenticated">Not authenticated</span>
            </div>
        </header>

        <!-- Initial Loading -->
        <div class="initial-loading app-loader app-loader--section" id="initialLoading" style="display: flex;" role="status" aria-label="Loading ratings" data-i18n="[aria-label]popup.content.loading">
            <div class="app-loader__indicator" aria-hidden="true"></div>
        </div>

        <!-- Auth Section -->
        <div class="auth-section" id="authSection" style="display: none;">
            <div class="auth-container">
                <!-- Inline Auth Error Banner -->
                <div id="authErrorMessage" class="auth-error-banner" style="display: none;" role="alert" aria-live="assertive" aria-atomic="true"></div>

                <!-- Login Form -->
                <div id="loginFormSection" class="auth-content active">
                    <!-- Step 1 Elements -->
                    <div id="loginStep1">
                        <!-- Google Button -->
                        <button type="button" id="googleLoginBtn" class="btn btn-google">
                            <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                            </svg>
                            <span class="btn-text" data-i18n="popup.auth.google_btn">Продолжить с Google</span>
                        </button>

                        <div class="auth-divider">
                            <span class="auth-divider-text" data-i18n="popup.auth.or">или</span>
                        </div>

                        <form id="loginEmailForm" class="auth-form" novalidate>
                            <div class="form-group">
                                <label for="loginEmail" data-i18n="popup.auth.email_label">Электронная почта</label>
                                <input type="email" id="loginEmail" class="form-input" placeholder="Ваш адрес электронной почты" data-i18n="[placeholder]popup.auth.email_placeholder" required autocomplete="email" aria-invalid="false" aria-describedby="loginEmailError">
                                <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="loginEmailError" style="display: none;"></div>
                            </div>
                            <button type="submit" id="loginEmailSubmitBtn" class="btn btn-primary btn-block">
                                <span class="btn-text" data-i18n="popup.auth.login_btn">Войти</span>
                            </button>
                        </form>
                    </div>

                    <!-- Step 2 Elements (Initially Hidden) -->
                    <div id="loginStep2" style="display: none;">
                        <form id="loginPasswordForm" class="auth-form" novalidate>
                            <div class="form-group">
                                <label for="staticEmail" data-i18n="popup.auth.email_label">Электронная почта</label>
                                <input type="text" id="staticEmail" class="form-input static-input-field" readonly aria-readonly="true" tabindex="-1">
                            </div>
                            <div class="form-group">
                                <div class="label-row">
                                    <label for="loginPassword" data-i18n="popup.auth.password_label">Пароль</label>
                                    <button type="button" id="forgotPasswordBtn" class="forgot-password-link" data-i18n="popup.auth.forgot_password">Забыли пароль?</button>
                                </div>
                                <div class="password-input-wrapper">
                                    <input type="password" id="loginPassword" class="form-input" placeholder="Ваш пароль" data-i18n="[placeholder]popup.auth.password_placeholder" required autocomplete="current-password" aria-invalid="false" aria-describedby="loginPasswordError">
                                    <button type="button" class="toggle-password" title="Show password" aria-label="Show password" data-i18n="[aria-label]popup.auth.password_show" aria-pressed="false"><svg data-icon="EYE" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 10C3.8 6.6 6.6 5 10 5C13.4 5 16.2 6.6 18 10C16.2 13.4 13.4 15 10 15C6.6 15 3.8 13.4 2 10Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 7.5A2.5 2.5 0 1 0 10 12.5A2.5 2.5 0 1 0 10 7.5Z"/></svg></button>
                                </div>
                                <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="loginPasswordError" style="display: none;"></div>
                            </div>
                            <button type="submit" id="loginPasswordSubmitBtn" class="btn btn-primary btn-block">
                                <span class="btn-text" data-i18n="popup.auth.login_btn">Войти</span>
                            </button>
                            
                            <div class="auth-switch back-nav">
                                <button type="button" id="backToEmailBtn" class="btn-text-link" data-i18n="popup.auth.back">← Назад</button>
                            </div>
                        </form>
                    </div>
                    
                    <div id="loginFooter" class="auth-switch">
                         <p><span data-i18n="popup.auth.no_account">Нет аккаунта?</span> <button type="button" id="showRegisterLink" class="btn-text-link" data-i18n="popup.auth.register_btn">Регистрация</button></p>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="registerFormSection" class="auth-content" style="display: none;">
                    <!-- Step 1: Basic Info -->
                    <div id="registerStep1">
                         <!-- Google Button (Visible on Step 1) -->
                        <button type="button" id="googleRegisterBtn" class="btn btn-google">
                            <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                            </svg>
                            <span class="btn-text" data-i18n="popup.auth.google_btn">Продолжить с Google</span>
                        </button>

                        <div class="auth-divider">
                            <span class="auth-divider-text" data-i18n="popup.auth.or">или</span>
                        </div>

                        <form id="registerInfoForm" class="auth-form" novalidate>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="registerFirstName" data-i18n="popup.auth.first_name_label">Имя</label>
                                    <input type="text" id="registerFirstName" class="form-input" placeholder="Ваше имя" data-i18n="[placeholder]popup.auth.first_name_placeholder" required autocomplete="given-name" aria-invalid="false" aria-describedby="registerFirstNameError">
                                    <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="registerFirstNameError" style="display: none;"></div>
                                </div>
                                <div class="form-group">
                                    <label for="registerLastName" data-i18n="popup.auth.last_name_label">Фамилия</label>
                                    <input type="text" id="registerLastName" class="form-input" placeholder="Ваша фамилия" data-i18n="[placeholder]popup.auth.last_name_placeholder" required autocomplete="family-name" aria-invalid="false" aria-describedby="registerLastNameError">
                                    <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="registerLastNameError" style="display: none;"></div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="registerEmail" data-i18n="popup.auth.email_label">Электронная почта</label>
                                <input type="email" id="registerEmail" class="form-input" placeholder="Ваш адрес электронной почты" data-i18n="[placeholder]popup.auth.email_placeholder" required autocomplete="email" aria-invalid="false" aria-describedby="registerEmailError">
                                <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="registerEmailError" style="display: none;"></div>
                            </div>
                            <button type="submit" id="registerInfoSubmitBtn" class="btn btn-primary btn-block">
                                <span class="btn-text" data-i18n="popup.auth.register_info">Продолжить</span>
                            </button>
                        </form>
                    </div>

                    <!-- Step 2: Password Creation -->
                    <div id="registerStep2" style="display: none;">
                        <form id="registerPasswordForm" class="auth-form" novalidate>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="staticName" data-i18n="popup.auth.first_name_label">Имя</label>
                                    <input type="text" id="staticName" class="form-input static-input-field" readonly aria-readonly="true" tabindex="-1">
                                </div>
                                <div class="form-group">
                                    <label for="staticSurname" data-i18n="popup.auth.last_name_label">Фамилия</label>
                                    <input type="text" id="staticSurname" class="form-input static-input-field" readonly aria-readonly="true" tabindex="-1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="staticRegisterEmail" data-i18n="popup.auth.email_label">Электронная почта</label>
                                <input type="text" id="staticRegisterEmail" class="form-input static-input-field" readonly aria-readonly="true" tabindex="-1">
                            </div>

                            <div class="form-group">
                                <label for="registerPassword" data-i18n="popup.auth.password_label">Пароль</label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="registerPassword" class="form-input" placeholder="Придумайте пароль" data-i18n="[placeholder]popup.auth.password_placeholder" required minlength="6" autocomplete="new-password" aria-invalid="false" aria-describedby="registerPasswordError">
                                    <button type="button" class="toggle-password" title="Show password" aria-label="Show password" data-i18n="[aria-label]popup.auth.password_show" aria-pressed="false"><svg data-icon="EYE" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 10C3.8 6.6 6.6 5 10 5C13.4 5 16.2 6.6 18 10C16.2 13.4 13.4 15 10 15C6.6 15 3.8 13.4 2 10Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 7.5A2.5 2.5 0 1 0 10 12.5A2.5 2.5 0 1 0 10 7.5Z"/></svg></button>
                                </div>
                                <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="registerPasswordError" style="display: none;"></div>
                            </div>
                            <div class="form-group">
                                <label for="registerConfirmPassword" data-i18n="popup.auth.confirm_password_label">Повторите пароль</label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="registerConfirmPassword" class="form-input" placeholder="Повторите пароль" data-i18n="[placeholder]popup.auth.confirm_password_placeholder" required minlength="6" autocomplete="new-password" aria-invalid="false" aria-describedby="registerConfirmPasswordError">
                                    <button type="button" class="toggle-password" title="Show password" aria-label="Show password" data-i18n="[aria-label]popup.auth.password_show" aria-pressed="false"><svg data-icon="EYE" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 10C3.8 6.6 6.6 5 10 5C13.4 5 16.2 6.6 18 10C16.2 13.4 13.4 15 10 15C6.6 15 3.8 13.4 2 10Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 7.5A2.5 2.5 0 1 0 10 12.5A2.5 2.5 0 1 0 10 7.5Z"/></svg></button>
                                </div>
                                <div class="field-error-message" role="alert" aria-live="polite" aria-atomic="true" id="registerConfirmPasswordError" style="display: none;"></div>
                            </div>

                            <button type="submit" id="registerFinalSubmitBtn" class="btn btn-primary btn-block">
                                <span class="btn-text" data-i18n="popup.auth.create_account">Зарегистрироваться</span>
                            </button>

                            <div class="auth-switch back-nav">
                                <button type="button" id="backToRegisterInfoBtn" class="btn-text-link" data-i18n="popup.auth.back">← Назад</button>
                            </div>
                        </form>
                    </div>

                     <div id="registerFooter" class="auth-switch">
                        <p><span data-i18n="popup.auth.have_account">Уже есть аккаунт?</span> <button type="button" id="showLoginLink" class="btn-text-link" data-i18n="popup.auth.login_btn">Войти</button></p>
                    </div>
                </div>

                <!-- Approval Status Section -->
                <div id="approvalStatusSection" class="auth-content approval-status-section" style="display: none;">
                    <div class="approval-status-card">
                        <div class="approval-status-icon-wrapper" id="approvalStatusIconWrapper">
                            <span class="approval-status-icon" id="approvalStatusIcon"></span>
                        </div>
                        <h2 class="approval-status-title" id="approvalStatusTitle">Заявка на рассмотрении</h2>
                        <p class="approval-status-message" id="approvalStatusMessage">
                            Ваш аккаунт успешно создан и ожидает подтверждения администратором.
                        </p>
                        <div class="approval-status-actions">
                            <button type="button" id="approvalBackToLoginBtn" class="btn btn-primary btn-block">
                                <span id="approvalBackBtnText" data-i18n="popup.approval.back_to_login">Вернуться ко входу</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content" id="mainContent" style="display: none;">
            <!-- Rating filters and search -->
            <div class="controls-bar" id="controlsBar">
                <!-- Chips Layer (Default View) -->
                <div class="chips-layer" id="chipsLayer">
                    <div class="filter-chips-group" role="group" aria-label="Rating filter" data-i18n="[aria-label]popup.content.filter_label">
                        <button type="button" class="filter-chip active" id="filterAllRatings" data-filter="all" aria-pressed="true" data-i18n="popup.content.filter_all">Все</button>
                        <button type="button" class="filter-chip" id="filterMyRatings" data-filter="my" aria-pressed="false" data-i18n="popup.content.filter_my">Мои</button>
                    </div>
                    <button type="button" id="searchToggleBtn" class="btn-search-toggle" aria-label="Поиск фильмов" title="Поиск фильмов" data-i18n="[aria-label]popup.content.search" aria-expanded="false" aria-controls="searchLayer">
                        <svg data-icon="SEARCH" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg>
                    </button>
                </div>

                <!-- Search Layer (Active Search View) -->
                <div class="search-layer" id="searchLayer" hidden inert>
                    <div class="search-input-wrapper">
                        <span class="search-input-icon" aria-hidden="true">
                            <svg data-icon="SEARCH" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg>
                        </span>
                        <input type="search" id="searchInput" class="compact-search-input" placeholder="Поиск фильмов..." data-i18n="[placeholder]popup.content.search_placeholder" aria-label="Поиск фильмов" autocomplete="off" aria-controls="searchResults">
                        <button type="button" id="searchCloseBtn" class="search-close-btn" aria-label="Закрыть поиск" data-i18n="[aria-label]popup.content.search_close">
                            <svg data-icon="CLOSE" aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5L15 15M15 5L5 15"/></svg>
                        </button>
                    </div>
                    <div id="searchResults" class="popover-surface compact-search-results" style="display: none;"></div>
                </div>
            </div>

            <!-- Feed Section -->
            <div class="feed-section">
                <div class="feed-content" id="feedContent" role="region" aria-label="Recent ratings" data-i18n="[aria-label]popup.content.feed_label" tabindex="0" aria-busy="false">
                    <div class="empty-state">
                        <div class="empty-state-icon"><svg data-icon="TV" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.6 2L10 5L13.4 2"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H5A2 2 0 0 1 3 15V8A2 2 0 0 1 5 6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H12ZM14.6 8.4A1 1 0 1 0 14.6 10.4A1 1 0 1 0 14.6 8.4ZM14.6 11.8A1 1 0 1 0 14.6 13.8A1 1 0 1 0 14.6 11.8Z"/></svg></div>
                        <h2 class="empty-state-title" data-i18n="popup.content.empty_title">No ratings yet</h2>
                        <p class="empty-state-text" data-i18n="popup.content.empty_text">Start rating movies to see them here!</p>
                    </div>
                    <!-- Infinite Scroll Trigger -->
                    <div id="infiniteScrollTrigger" class="infinite-scroll-trigger" style="display: none; justify-content: center; padding: 12px;">
                        <div class="app-loader app-loader--inline app-loader--compact" role="status" aria-label="Loading more ratings" data-i18n="[aria-label]popup.content.loading_more">
                            <div class="app-loader__indicator" aria-hidden="true"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Loading overlay -->
            <div class="loading app-loader app-loader--section" id="loading" style="display: none;" role="status" aria-live="polite">
                <div class="app-loader__indicator" aria-hidden="true"></div>
                <span class="app-loader__label" data-i18n="popup.content.loading">Loading...</span>
            </div>
        </main>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage" style="display: none;" role="alert" aria-live="assertive" aria-atomic="true">
            <span id="popupStatusText"></span>
            <button type="button" id="popupStatusDismiss" class="popup-status-dismiss" aria-label="Dismiss message" data-i18n="[aria-label]popup.content.error_dismiss"><svg data-icon="CLOSE" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5L15 15M15 5L5 15"/></svg></button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../libs/firebase-app-compat.js"></script>
    <script src="../../libs/firebase-firestore-compat.js"></script>
    <script src="../../libs/firebase-auth-compat.js"></script>
    <script src="../shared/config/kinopoisk.config.js"></script>
    <script src="../shared/services/ImdbParsingService.js"></script>
    <script src="../shared/services/TmdbFallbackQueueService.js"></script>
    <script src="../shared/services/KinopoiskGraphqlService.js"></script>
    <script src="../shared/services/KinopoiskService.js"></script>
    <script src="../shared/services/MovieCacheService.js"></script>
    <script src="../shared/config/rating.config.js"></script>
    <script src="../shared/services/ExternalRatingSync.js"></script>
    <script src="../shared/services/RatingService.js"></script>
    <script src="../shared/services/RatingsCacheService.js"></script>
    <script src="../shared/services/WatchlistService.js"></script>
    <script src="../shared/services/FavoriteService.js"></script>
    <script src="../shared/services/UserService.js"></script>
    <script src="../shared/utils/Utils.js"></script>
    <script src="../shared/utils/Icons.js"></script>
    <script src="../shared/utils/IconUtils.js"></script>
    <script src="../shared/utils/auth.js"></script>
    <script src="../shared/components/BackToTop.js"></script>
    <script src="../shared/components/Navigation.js"></script>
    <script src="../shared/firestore.js"></script>
    <script src="../shared/services/UpdateService.js"></script>
    <script src="../shared/components/ConfirmDialog.js"></script>
    <script type="module" src="popup.js"></script>

</body>
</html>
