<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ratings.page_title">Оценённые — Сеанс</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/router.css">
    <link rel="stylesheet" href="../../shared/styles/search.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="../../shared/styles/ratings.css">
    <link rel="stylesheet" href="../../shared/styles/rating-dialog.css">
    <link rel="stylesheet" href="../../shared/styles/filter-controls.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded as print media and switched by asyncStyles.js: the first paint does not wait for the font CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" data-async-style>
    <script src="../../shared/utils/asyncStyles.js"></script>
    
    <!-- Resource Hints -->
    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preload" as="script" href="../../../libs/firebase-auth-compat.js">
    <link rel="preload" as="script" href="../../../libs/firebase-firestore-compat.js">
    <link rel="preconnect" href="https://firebaseio.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>
    <!-- Navigation will be inserted here by Navigation.js -->
    
    <!-- Main Content -->
    <main class="ratings-main">
        <div class="ratings-container">
            <!-- Page Header -->


            <!-- Filters Section -->
            <div class="filters-section filter-panel">
                <div class="filters-header">
                    <h3 class="filters-title" data-i18n="ratings.filters.title">Filters & Search</h3>
                    <div class="filters-controls">
                        <button type="button" class="clear-filters-btn" id="clearFiltersBtn">
                            <span class="btn-icon"><svg data-icon="TRASH" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 4V3A1 1 0 0 1 8 2H12A1 1 0 0 1 13 3V4H16A1 1 0 0 1 17 5V6A1 1 0 0 1 16 7H4A1 1 0 0 1 3 6V5A1 1 0 0 1 4 4Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8V15A2 2 0 0 0 7 17H13A2 2 0 0 0 15 15V8M10 10V13"/></svg></span>
                            <span data-i18n="ratings.filters.clear">Clear Filters</span>
                        </button>
                        <button type="button" class="toggle-filters-btn" id="toggleFiltersBtn" aria-expanded="true" aria-label="Show or hide filters" data-i18n="[aria-label]ratings.filters.toggle">
                            <svg data-icon="CHEVRON_UP" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12.5L10 7.5L15 12.5"/></svg>
                        </button>
                    </div>
                </div>

                <div class="filters-grid">
                    <!-- Search -->
                    <div class="filter-group">
                        <label class="filter-label" for="movieSearchInput" data-i18n="ratings.filters.search_placeholder">Search Movies</label>
                        <div class="search-input-wrapper">
                            <input type="text" class="search-input" id="movieSearchInput" data-i18n="ratings.filters.search_placeholder" placeholder="Search by title...">
                            <span class="search-icon"><svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg></span>
                        </div>
                    </div>

                    <!-- Genre Filter -->
                    <div class="filter-group">
                        <label class="filter-label" for="genreFilter" data-i18n="ratings.filters.genre">Genre</label>
                        <select id="genreFilter" data-filter-control>
                            <option value="" data-i18n="ratings.filters.all_genres">All Genres</option>
                        </select>
                    </div>

                    <!-- Year Filter -->
                    <div class="filter-group">
                        <label class="filter-label" for="yearFilter" data-i18n="ratings.filters.year">Year</label>
                        <select id="yearFilter" data-filter-control>
                            <option value="" data-i18n="ratings.filters.all_years">All Years</option>
                        </select>
                    </div>

                    <!-- User Filter -->
                    <div class="filter-group" id="userFilterGroup">
                        <label class="filter-label" for="userFilter" data-i18n="ratings.filters.user">User</label>
                        <select id="userFilter" data-filter-control>
                            <option value="" data-i18n="ratings.filters.all_users">All Users</option>
                        </select>
                    </div>

                    <!-- My Rating Filter -->
                    <div class="filter-group" id="myRatingFilterGroup">
                        <label class="filter-label" for="myRatingFilter" data-i18n="ratings.filters.my_rating">Моя оценка</label>
                        <select id="myRatingFilter" data-filter-control>
                            <option value="" data-i18n="ratings.filters.any_my_rating">Любая</option>
                            <option value="9-10">9–10</option>
                            <option value="7-8">7–8</option>
                            <option value="5-6">5–6</option>
                            <option value="1-4">1–4</option>
                            <option value="none" data-i18n="ratings.filters.my_rating_none">Не оценено мной</option>
                        </select>
                    </div>
                    <!-- Sort Options -->
                    <div class="filter-group filter-group--sort">
                        <label class="filter-label" for="sortFilter" data-i18n="ratings.filters.sort">Sort By</label>
                        <select id="sortFilter" data-sort-control>
                            <option value="date-desc" data-i18n="ratings.sort.date_newest">Date Added (Newest)</option>
                            <option value="date-asc" data-i18n="ratings.sort.date_oldest">Date Added (Oldest)</option>
                            <option value="rating-desc" data-i18n="ratings.sort.rating_high">My Rating (High to Low)</option>
                            <option value="rating-asc" data-i18n="ratings.sort.rating_low">My Rating (Low to High)</option>
                            <option value="avg-rating-desc" data-i18n="ratings.sort.avg_high">Avg Rating (High to Low)</option>
                            <option value="avg-rating-asc" data-i18n="ratings.sort.avg_low">Avg Rating (Low to High)</option>
                            <option value="title-asc" data-i18n="ratings.sort.title_az">Title (A-Z)</option>
                            <option value="title-desc" data-i18n="ratings.sort.title_za">Title (Z-A)</option>
                            <option value="year-desc" data-i18n="ratings.sort.year_newest">Year (Newest)</option>
                            <option value="year-asc" data-i18n="ratings.sort.year_oldest">Year (Oldest)</option>
                        </select>
                    </div>

                    <!-- Average Rating Filter -->
                    <div class="filter-group filter-group--range">
                        <label class="filter-label" for="avgRatingFrom" data-i18n="ratings.filters.avg_rating">Average Rating</label>
                        <div class="range-slider-container filter-range-layout-inline" id="avgRatingSlider">
                            <div class="slider-values">
                                <span id="avgRatingMinDisplay">1.0</span>
                                <span id="avgRatingMaxDisplay">10.0</span>
                            </div>
                            <div class="slider-track-wrapper">
                                <div class="slider-track" id="avgRatingTrack"></div>
                                <div class="slider-range" id="avgRatingRange"></div>
                                <input type="range" id="avgRatingFrom" class="range-input" min="1.0" max="10.0" value="1.0" step="0.1" aria-label="Minimum average rating" data-i18n="[aria-label]ratings.filters.avg_from">
                                <input type="range" id="avgRatingTo" class="range-input" min="1.0" max="10.0" value="10.0" step="0.1" aria-label="Maximum average rating" data-i18n="[aria-label]ratings.filters.avg_to">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Active Filters Container -->
                <div class="active-filters-container" id="activeFiltersContainer" style="display: none;">
                    <span class="active-filters-label" data-i18n="ratings.active_filters.label">Active Filters:</span>
                    <div class="active-filters-list" id="activeFiltersList">
                        <!-- Active filter tags will be inserted here -->
                    </div>
                </div>
            </div>

            <!-- Live updates: new ratings arrived while the user is scrolled down -->
            <div class="ratings-live-region" aria-live="polite">
                <button type="button" class="ratings-live-pill" id="ratingsLivePill" hidden>
                    <svg data-icon="ARROW_UP" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 16V4M5 9L10 4L15 9"/></svg>
                    <span id="ratingsLivePillText"></span>
                </button>
            </div>

            <!-- Results Info -->
            <div class="results-info" id="resultsInfo">
                <span class="results-count" id="resultsCount" data-i18n="ratings.results.loading">Loading...</span>
                <span class="results-mode" id="resultsMode"></span>
                <div class="results-view-toggle" role="group" data-i18n="[aria-label]ratings.view.label" aria-label="Вид списка">
                    <button type="button" class="results-view-btn" data-view="grid" aria-pressed="true" data-i18n="[title]ratings.view.grid" title="Сетка">
                        <svg data-icon="GRID" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 3H7A1 1 0 0 1 8 4V7A1 1 0 0 1 7 8H4A1 1 0 0 1 3 7V4A1 1 0 0 1 4 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 3H16A1 1 0 0 1 17 4V7A1 1 0 0 1 16 8H13A1 1 0 0 1 12 7V4A1 1 0 0 1 13 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12H7A1 1 0 0 1 8 13V16A1 1 0 0 1 7 17H4A1 1 0 0 1 3 16V13A1 1 0 0 1 4 12Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M13 11H16A2 2 0 0 1 18 13V16A2 2 0 0 1 16 18H13A2 2 0 0 1 11 16V13A2 2 0 0 1 13 11Z"/></svg>
                    </button>
                    <button type="button" class="results-view-btn" data-view="list" aria-pressed="false" data-i18n="[title]ratings.view.list" title="Список">
                        <svg data-icon="LIST" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M4 3.5A1.5 1.5 0 1 0 4 6.5A1.5 1.5 0 1 0 4 3.5ZM4 8.5A1.5 1.5 0 1 0 4 11.5A1.5 1.5 0 1 0 4 8.5ZM4 13.5A1.5 1.5 0 1 0 4 16.5A1.5 1.5 0 1 0 4 13.5Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H17M9 10H17M9 15H17"/></svg>
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div class="loading-section app-loader app-loader--page" id="loadingSection" role="status" aria-live="polite">
                <div class="app-loader__indicator" aria-hidden="true"></div>
                <p class="app-loader__label" data-i18n="ratings.loading">Loading your collection...</p>
            </div>

            <!-- Movies Grid -->
            <div class="movies-grid" id="moviesGrid">
                <!-- Movie cards will be inserted here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon"><svg data-icon="TV" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.6 2L10 5L13.4 2"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H5A2 2 0 0 1 3 15V8A2 2 0 0 1 5 6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H12ZM14.6 8.4A1 1 0 1 0 14.6 10.4A1 1 0 1 0 14.6 8.4ZM14.6 11.8A1 1 0 1 0 14.6 13.8A1 1 0 1 0 14.6 11.8Z"/></svg></div>
                <h3 class="empty-state-title" data-i18n="ratings.empty.title">No movies found</h3>
                <p class="empty-state-text" data-i18n="ratings.empty.message">Try adjusting your filters or start rating some movies!</p>
                <button type="button" class="btn btn-primary empty-state-btn" id="emptyStateSearchBtn" data-i18n="ratings.empty.search_btn">
                    Search Movies
                </button>
            </div>

            <!-- Error State -->
            <div class="error-state" id="errorState" style="display: none;">
                <div class="error-state-icon"><svg data-icon="WARNING" style="color: #ef4444;" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3.2L17.4 16H2.6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3.2L17.4 16H2.6ZM10 7H10A1 1 0 0 1 11 8V10.6A1 1 0 0 1 10 11.6H10A1 1 0 0 1 9 10.6V8A1 1 0 0 1 10 7ZM10 12.45A1.15 1.15 0 1 0 10 14.75A1.15 1.15 0 1 0 10 12.45Z"/></svg></div>
                <h3 class="error-state-title" data-i18n="ratings.error.title">Something went wrong</h3>
                <p class="error-state-text" id="errorMessage" data-i18n="ratings.error.message">Failed to load movies</p>
                <button type="button" class="btn btn-primary error-state-btn" id="retryBtn" data-i18n="ratings.error.retry">Try Again</button>
            </div>
        </div>
    </main>

    <!-- Main Script -->
    <!-- Firebase SDK (defer, loaded in order) -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>

    <!-- Config & Core -->
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>

    <!-- Services -->
    <script defer src="../../shared/services/RatingsCacheService.js"></script>
    <script defer src="../../shared/config/rating.config.js"></script>
    <script defer src="../../shared/services/ExternalRatingSync.js"></script>
    <script defer src="../../shared/services/RatingService.js"></script>
    <script defer src="../../shared/services/SeriesEpisodeRatingService.js"></script>
    <script defer src="../../shared/services/player/PlaybackSelection.js"></script>
    <script defer src="../../shared/services/MovieCacheService.js"></script>
    <script defer src="../../shared/services/TmdbFallbackQueueService.js"></script>
    <script defer src="../../shared/services/KinopoiskGraphqlService.js"></script>
    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/RatingsRefreshService.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>

    <!-- Utils -->
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>

    <!-- Components -->
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="../../shared/components/MovieCardActions.js"></script>
    <script defer src="../../shared/services/ProviderRatingsBackfill.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/RatingDialog.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/Router.js"></script>

    <!-- Main Script -->
    <script defer src="../../shared/components/SortControl.js"></script>
    <script defer src="../../shared/components/FilterControls.js"></script>
    <script defer src="ratings.js" type="module"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
