<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HDRezka — проверка воспроизведения</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/player.css">
    <link rel="stylesheet" href="hdrezka-probe.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <script defer src="../../shared/lib/hls.min.js"></script>
    <script defer src="../../shared/services/player/UrlPolicy.js"></script>
    <script defer src="../../shared/services/player/HlsPolicyLoader.js"></script>
    <script defer src="../../shared/services/player/HlsPlaybackFactory.js"></script>
    <script defer src="../../shared/services/player/HdrezkaProbeSources.js"></script>
    <script defer src="hdrezka-probe.js"></script>
</head>
<body class="hdrezka-probe-page">
    <main class="hdrezka-probe">
        <p class="hdrezka-probe__eyebrow">MovieList · эксперимент</p>
        <h1>HDRezka</h1>
        <p>Проверка видео в плеере расширения. Автоматический поиск фильмов ещё не подключён.</p>
        <section class="hdrezka-probe__panel" aria-labelledby="importHeading">
            <h2 id="importHeading">Открыть запись Network</h2>
            <p>Выберите HAR, записанный при воспроизведении на HDRezka. Файл читается локально; ссылки действуют ограниченное время.</p>
            <label for="harFile">Файл HAR или JSON</label>
            <input id="harFile" type="file" accept=".har,.json,.txt,application/json">
            <label for="streamSelect">Записанный поток</label>
            <select id="streamSelect" disabled><option>Сначала выберите файл</option></select>
            <div class="hdrezka-probe__actions">
                <button id="playButton" class="btn btn-primary" type="button" disabled>Воспроизвести</button>
                <button id="stopButton" class="btn btn-secondary" type="button" disabled>Остановить</button>
                <button id="clearButton" class="btn btn-secondary" type="button" disabled>Очистить</button>
            </div>
            <p id="probeStatus" role="status" aria-live="polite">Выберите файл для начала проверки.</p>
        </section>
        <div id="playerMount" class="hdrezka-probe__player player-surface__content" hidden></div>
        <p id="playbackMetrics" class="hdrezka-probe__metrics" aria-live="off"></p>
    </main>
</body>
</html>
