<!DOCTYPE html>
<html lang="en" data-provider-ratings-backfill="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.titles.bookmarks">Закладки — Сеанс</title>
    <!-- Styles -->
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="bookmarks.css">
    <link rel="stylesheet" href="../../shared/styles/filter-controls.css">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body class="dark-theme">
    <!-- Navigation will be inserted here -->

    <main class="main-content">
        <div class="bookmarks-container">
            <!-- Sidebar -->
            <aside class="bookmarks-sidebar">
                <div class="sidebar-header">
                    <h2 data-i18n="bookmarks.title">Bookmarks</h2>
                </div>
                <nav class="sidebar-nav" aria-label="Списки фильмов">
                    <button type="button" class="sidebar-item filter-choice active" data-filter="all" aria-pressed="true">
                        <span class="sidebar-icon"><svg data-icon="DOCUMENT" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3H6A2 2 0 0 0 4 5V15A2 2 0 0 0 6 17H14A2 2 0 0 0 16 15V8"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M11 2H11.2A2 2 0 0 1 12.6 2.6L16.4 6.4A2 2 0 0 1 17 7.8V8H12A1 1 0 0 1 11 7Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12H12"/></svg></span>
                        <span class="sidebar-label" data-i18n="bookmarks.sidebar.all">All</span>
                        <span class="sidebar-count" id="count-all">0</span>
                    </button>
                    <button type="button" class="sidebar-item filter-choice" data-filter="watching" aria-pressed="false">
                        <span class="sidebar-icon"><svg data-icon="EYE" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 10C3.8 6.6 6.6 5 10 5C13.4 5 16.2 6.6 18 10C16.2 13.4 13.4 15 10 15C6.6 15 3.8 13.4 2 10Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 7.5A2.5 2.5 0 1 0 10 12.5A2.5 2.5 0 1 0 10 7.5Z"/></svg></span>
                        <span class="sidebar-label" data-i18n="bookmarks.sidebar.watching">Watching</span>
                        <span class="sidebar-count" id="count-watching">0</span>
                    </button>
                    <button type="button" class="sidebar-item filter-choice" data-filter="watched" aria-pressed="false">
                        <span class="sidebar-icon"><svg data-icon="WATCHED" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3H14A3 3 0 0 1 17 6V14A3 3 0 0 1 14 17H6A3 3 0 0 1 3 14V6A3 3 0 0 1 6 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.6 10.2L9 12.6L13.4 7.6"/></svg></span>
                        <span class="sidebar-label" data-i18n="bookmarks.sidebar.watched">Watched</span>
                        <span class="sidebar-count" id="count-watched">0</span>
                    </button>
                    <button type="button" class="sidebar-item filter-choice" data-filter="plan_to_watch" aria-pressed="false">
                        <span class="sidebar-icon"><svg data-icon="BOOKMARK" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5A2 2 0 0 1 7 3H13A2 2 0 0 1 15 5V17L10 13.6L5 17Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3L10 13.6L15 17L15 5C15 3.9 14.1 3 13 3L10 3Z"/></svg></span>
                        <span class="sidebar-label" data-i18n="bookmarks.sidebar.plan_to_watch">Plan to Watch</span>
                        <span class="sidebar-count" id="count-plan_to_watch">0</span>
                    </button>
                    <button type="button" class="sidebar-item filter-choice" data-filter="favorite" aria-pressed="false">
                        <span class="sidebar-icon"><svg data-icon="HEART" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 16.6L4.2 10.8A3.9 3.9 0 0 1 9.7 5.3L10 5.6L10.3 5.3A3.9 3.9 0 0 1 15.8 10.8Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 5.6L10 16.6L15.8 10.8C17.13 9.25 17.04 6.94 15.6 5.5C14.16 4.06 11.85 3.97 10.3 5.3L10 5.6Z"/></svg></span>
                        <span class="sidebar-label" data-i18n="bookmarks.sidebar.favorites">Favorites</span>
                        <span class="sidebar-count" id="count-favorite">0</span>
                    </button>
                </nav>
                
                <div class="sidebar-divider"></div>

                <div class="sidebar-section">
                    <div class="sidebar-header-sm">
                        <span data-i18n="bookmarks.sidebar.collections">COLLECTIONS</span>
                        <button class="icon-btn" id="createCollectionBtn" title="Create Collection">
                            <svg data-icon="PLUS" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 4V16M4 10H16"/></svg>
                        </button>
                    </div>
                    <div id="customCollectionsList" class="custom-collections-list">
                        <!-- Collections will be loaded here -->
                    </div>
                </div>

                <!-- Migration section removed -->
            </aside>

            <!-- Main Grid Area -->
            <section class="bookmarks-content">
                <header class="content-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h1 id="pageTitle" data-i18n="bookmarks.header.all_bookmarks">All Bookmarks</h1>
                        <div class="collection-menu-anchor">
                            <button type="button" id="collectionMenuBtn" class="collection-menu-btn" style="display: none;" title="Collection options" aria-label="Collection options" aria-haspopup="menu" aria-expanded="false">
                                <svg data-icon="MORE_VERTICAL" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 2.4A1.6 1.6 0 1 0 10 5.6A1.6 1.6 0 1 0 10 2.4ZM10 8.4A1.6 1.6 0 1 0 10 11.6A1.6 1.6 0 1 0 10 8.4ZM10 14.4A1.6 1.6 0 1 0 10 17.6A1.6 1.6 0 1 0 10 14.4Z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="header-controls">
                        <div class="search-wrapper">
                            <input type="text" id="bookmarksSearchInput" data-i18n="bookmarks.search.placeholder" placeholder="Search in bookmarks...">
                            <span class="search-icon"><svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg></span>
                        </div>
                        <div class="sort-wrapper">
                            <label class="sort-control__label--sr-only" for="sortFilter" data-i18n="ratings.filters.sort">Sort By</label>
                            <select id="sortFilter" data-sort-control class="custom-select">
                                <option value="updatedAt-desc" data-i18n="bookmarks.sort.updated_desc">Recently Updated</option>
                                <option value="createdAt-desc" data-i18n="bookmarks.sort.created_desc">Recently Added</option>
                                <option value="movieTitle-asc" data-i18n="bookmarks.sort.title_asc">Title (A-Z)</option>
                                <option value="releaseYear-desc" data-i18n="bookmarks.sort.year_desc">Year (Newest)</option>
                                <option value="avgRating-desc" data-i18n="bookmarks.sort.rating_desc">Rating</option>
                            </select>
                        </div>
                    </div>
                </header>

                <div id="loadingSection" class="loading-section app-loader app-loader--section" role="status" aria-live="polite">
                    <div class="app-loader__indicator" aria-label="Loading bookmarks"></div>
                </div>

                <div id="moviesGrid" class="movies-grid">
                    <!-- Movies will be rendered here -->
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon"><svg data-icon="FOLDER" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M2 9V6A2 2 0 0 1 4 4H7.6A2 2 0 0 1 9 4.6L10.4 6H16A2 2 0 0 1 18 8V9Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9V14A2 2 0 0 0 5 16H15A2 2 0 0 0 17 14V9"/></svg></div>
                    <h3 data-i18n="bookmarks.empty.title">No bookmarks found</h3>
                    <p data-i18n="bookmarks.empty.message">Add using the bookmarks menu on any movie.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../../../libs/firebase-app-compat.js"></script>
    <script src="../../../libs/firebase-firestore-compat.js"></script>
    <script src="../../../libs/firebase-auth-compat.js"></script>
    <script src="../../shared/firestore.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    
    <script src="../../shared/services/UserService.js"></script>
    <script src="../../shared/services/MovieCacheService.js"></script>
    <script src="../../shared/config/rating.config.js"></script>
    <script src="../../shared/services/ExternalRatingSync.js"></script>
    <script src="../../shared/services/RatingService.js"></script>
    <script src="../../shared/services/FavoriteService.js"></script>
    <script src="../../shared/services/CollectionService.js"></script>
    <script src="../../shared/data/collectionIcons.js"></script>
    <script src="../../shared/services/ProgressService.js"></script>
    
    <script src="../../shared/utils/Utils.js"></script>
    <script src="../../shared/utils/Icons.js"></script>
    <script src="../../shared/components/MovieCard.js"></script>
    <script src="../../shared/components/MovieCardActions.js"></script>
    <script src="../../shared/services/KinopoiskGraphqlService.js"></script>
    <script src="../../shared/services/RatingsRefreshService.js"></script>
    <script src="../../shared/services/ProviderRatingsBackfill.js"></script>
    <script src="../../shared/components/BackToTop.js"></script>
    <script src="../../shared/components/Navigation.js"></script>
    
    <script src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/SortControl.js"></script>
    <script defer src="../../shared/components/FilterControls.js"></script>
    <script type="module" src="bookmarks.js"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
