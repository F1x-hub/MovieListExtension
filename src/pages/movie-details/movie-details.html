<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - Movie Rating Extension</title>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="../../shared/styles/player.css">
    <link rel="stylesheet" href="../../shared/styles/poster-fixes.css">
    
    <!-- Page-specific Styles -->
    <link rel="stylesheet" href="../../shared/styles/image-lightbox.css">
    <link rel="stylesheet" href="movie-details.css">

    <!-- Resource Hints -->
    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preload" as="script" href="../../../libs/firebase-firestore-compat.js">
    <link rel="preconnect" href="https://firebaseio.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://api.kinopoisk.dev">
    <link rel="dns-prefetch" href="https://ex-fs.net">
    <link rel="dns-prefetch" href="https://fix.kinogo.luxury">
    <link rel="dns-prefetch" href="https://rutube.ru">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
</head>
<body>
    <!-- Navigation will be inserted here by Navigation.js -->
    
    <!-- Movie Details Container -->
    <div class="movie-details-page-container">
        <!-- Loader -->
        <div class="loading-state" id="loadingState" style="display: none;">
            <div class="loading-spinner-large"></div>
            <h3 class="loading-title" data-i18n="movie_details.loading">Загрузка информации о фильме...</h3>
            <p class="loading-text" data-i18n="movie_details.wait">Пожалуйста, подождите</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h3 class="error-title" id="errorMessage">Failed to load movie</h3>
            <button class="btn btn-primary" onclick="window.location.reload()">Retry</button>
        </div>
        
        <!-- Movie Content Container -->
        <div class="movie-details-content" id="movieDetailsContainer">
            <!-- Movie details will be loaded here dynamically -->
        </div>
    </div>

    <!-- Rating Modal -->
    <div id="ratingModal" class="modal-overlay" style="display: none;">
        <div class="modal rating-modal-redesign">
            <!-- Header -->
            <div class="rating-modal-header">
                <h2 class="modal-title" data-i18n="movie_details.rate_title">Rate This Movie</h2>
                <button class="modal-close" id="ratingModalClose">×</button>
            </div>
            
            <!-- Body -->
            <div class="rating-modal-body">
                <!-- Poster Container -->
                <div class="rating-poster-container">
                    <img id="ratingMoviePoster" class="rating-modal-poster" src="" alt="Movie Poster">
                    <div class="rating-movie-info-overlay">
                        <h3 id="ratingMovieTitle" class="rating-movie-title">Movie Title</h3>
                        <p id="ratingMovieMeta" class="rating-movie-meta">Year • Genre</p>
                    </div>
                </div>

                <!-- Rating Container -->
                <div class="rating-stars-container">
                    <div class="stars-wrapper" id="ratingStars">
                        <!-- Stars will be injected by JS -->
                    </div>
                </div>

                <!-- Review Section -->
                <div class="rating-review-section">
                    <button id="writeReviewBtn" class="btn btn-ghost btn-full-width">
                        <span class="icon">✎</span> <span data-i18n="movie_details.write_review">Write a Review</span>
                    </button>
                    <div id="reviewContainer" class="review-container" style="display: none;">
                        <textarea id="ratingComment" class="review-textarea" rows="4" maxlength="500" data-i18n="movie_details.review_placeholder" placeholder="What did you think about this movie?"></textarea>
                        <div class="char-counter">
                            <span id="charCount">0</span>/500
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="rating-modal-footer">
                <button id="cancelRatingBtn" class="btn btn-secondary" data-i18n="movie_details.cancel">Cancel</button>
                <button id="saveRatingBtn" class="btn btn-accent" data-i18n="movie_details.save_rating">Save Rating</button>
            </div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoPlayerModal" class="modal-overlay" style="display: none;">
        <div class="modal video-modal">
            <div class="modal-header video-header">
                <h2 class="modal-title" id="videoTitle" data-i18n="movie_details.watch_movie">Watch Movie</h2>
                <button class="modal-close" id="closeVideoBtn">×</button>
            </div>
            <div class="modal-body video-body">
                <div class="source-buttons-container" id="sourceButtonsContainer"></div>
                <div class="video-container" id="videoContainer">
                    <!-- Player iframe will be inserted here -->
                    <div class="video-placeholder">
                        <div class="loading-spinner"></div>
                        <span data-i18n="movie_details.loading_player">Loading player...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Trailer Modal (Independent) -->
    <div id="trailerModal" class="modal-overlay" style="display: none;">
        <div class="modal video-modal trailer-modal-content">
            <div class="modal-header video-header">
                <h2 class="modal-title" id="trailerTitle" data-i18n="movie_details.trailer">Trailer</h2>
                <button class="modal-close" id="closeTrailerBtn">×</button>
            </div>
            <div class="modal-body video-body">
                <div class="video-container" id="trailerContainer">
                    <!-- Trailer iframe will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Announce Modal -->
    <div id="announceModal" class="modal-overlay" style="display: none;">
        <div class="modal announce-modal">
            <div class="modal-header announce-modal-header">
                <h2 class="modal-title">Запланировать анонс</h2>
                <button class="modal-close" id="closeAnnounceBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body announce-modal-body">

                <!-- Preview блока анонса -->
                <div class="announce-preview">
                    <img id="announcePreviewPoster" class="announce-preview-poster" src="" alt="Постер">
                    <div class="announce-preview-info">
                        <h3 id="announcePreviewTitle" class="announce-preview-title"></h3>
                        <p id="announcePreviewYear" class="announce-preview-year"></p>
                        <p id="announcePreviewDesc" class="announce-preview-desc"></p>
                    </div>
                </div>

                <!-- Telegram preview label -->
                <div class="announce-tg-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-2.04 9.613c-.147.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.566-4.46c.537-.194 1.006.131.907.607z"/></svg>
                    Предпросмотр Telegram-сообщения
                </div>



                <!-- Дата и время -->
                <div class="announce-form-row">
                    <div class="announce-form-group">
                        <label class="announce-label" for="announceDate">Дата отправки</label>
                        <input type="date" id="announceDate" class="announce-input">
                    </div>
                    <div class="announce-form-group">
                        <label class="announce-label" for="announceTime">Время отправки</label>
                        <input type="time" id="announceTime" class="announce-input">
                    </div>
                </div>

                <!-- Статус бота -->
                <div class="announce-bot-status" id="announceBotStatus">
                    <span class="announce-bot-status-dot" id="announceBotStatusDot"></span>
                    <span id="announceBotStatusText">Проверка бота...</span>
                </div>

            </div>
            <div class="announce-modal-footer">
                <button class="btn btn-secondary" id="cancelAnnounceBtn">Отмена</button>
                <button class="btn btn-announce-send" id="sendAnnounceBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
                    Запланировать
                </button>
            </div>
        </div>
    </div>

    <!-- Restored Player Floating Button (Hidden by default) -->
    <div id="restorePlayerBtn" class="restore-player-btn" style="display: none;">
        <span class="restore-icon">▶</span>
        <div class="restore-info">
            <span class="restore-title" data-i18n="movie_details.watch_movie">Watch Movie</span>
            <span class="restore-subtitle" data-i18n="movie_details.click_to_expand">Click to expand</span>
        </div>
        <button class="restore-close" id="closeRestoreBtn">×</button>
    </div>

    <!-- Scripts -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/ImdbParsingService.js"></script>
    <script defer src="../../shared/services/MovieCacheService.js"></script>
    <script defer src="../../shared/services/RatingService.js"></script>
    <!-- Parser Infrastructure -->
    <script defer src="../../shared/services/parsers/BaseParserService.js"></script>
    <script defer src="../../shared/services/parsers/ParserRegistry.js"></script>
    <script defer src="../../shared/services/parsers/ExFsParser.js"></script>
    <script defer src="../../shared/services/parsers/SeasonvarParser.js"></script>
    <script defer src="../../shared/services/parsers/KinogoParser.js"></script>
    <script defer src="../../shared/services/parsers/RutubeParser.js"></script>
    <script defer src="../../shared/services/parsers/parser-init.js"></script>
    <script defer src="../../shared/services/AwardsParsingService.js"></script>
    <script defer src="../../shared/services/SequelsParsingService.js"></script>
    <script defer src="../../shared/services/SimilarMoviesParsingService.js"></script>
    <!-- AniskipService.js removed — lazy-loaded via LazyLoader when video player opens -->
    <!-- hls.min.js removed — lazy-loaded via LazyLoader when HLS playback needed -->
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>
    <script defer src="../../shared/services/ProgressService.js"></script>
    <script defer src="../../shared/utils/helpers.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <!-- SpotifyService.js and spotify.config.js removed — lazy-loaded via LazyLoader when Soundtrack tab opens -->
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/utils/LazyLoader.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/ImageLightbox.js"></script>
    <script defer src="../../shared/components/Router.js"></script>
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="../../../content-scripts/player-cleaner.js"></script>
    <script defer src="movie-details.js" type="module"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
