<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Главная | MovieList Extension</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="home.css">

    <!-- Resource Hints -->
    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preconnect" href="https://firebaseio.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://avatars.mds.yandex.net">
    <link rel="dns-prefetch" href="https://image.tmdb.org">
    <link rel="dns-prefetch" href="https://avatars.mds.yandex.net">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
</head>
<body>

    <div class="container">
        <!-- Loading State -->
        <div id="loader" class="loader-container app-loader app-loader--page" role="status" aria-live="polite">
            <div class="app-loader__indicator" aria-hidden="true"></div>
            <p class="app-loader__label">Загрузка витрины...</p>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="error-container" style="display: none;">
            <div class="error-icon"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ef4444;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
            <h2>Ошибка загрузки</h2>
            <p id="error-message">Не удалось загрузить данные</p>
            <button id="retry-btn" class="retry-button">Повторить</button>
        </div>

        <!-- Content Area -->
        <div id="content" class="content-container" style="display: none;">
            
            <!-- Featured Slider -->
            <section class="featured-slider-section">
                <div class="featured-slider-container" id="featured-slider">
                    <!-- Featured slider items injected here -->
                </div>
                <!-- Pagination Dots -->
                <div class="slider-pagination" id="slider-pagination">
                    <!-- Dots will be generated by JS -->
                </div>
            </section>

            <!-- Personal Tier (CTA banner when logged out, Watching / Watchlist when logged in) -->
            <section id="personal-tier" class="personal-tier-section">
                <!-- Injected dynamically -->
            </section>

            <!-- Dashboard Section (Personal Statistics & Community Top) -->
            <section id="dashboard-section" class="dashboard-section" style="display: none;">
                <!-- Injected dynamically for logged in users -->
            </section>
            
            <!-- Films Section -->
            <section id="films-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg class="section-header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                        <h2>Фильмы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=films" class="section-see-all">
                        <span>Все фильмы</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
                <!-- Grid -->
                <div class="grid-container" id="films-grid">
                    <!-- Grid items injected here -->
                </div>
            </section>

            <!-- Series Section -->
            <section id="series-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg class="section-header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                        <h2>Сериалы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=series" class="section-see-all">
                        <span>Все сериалы</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
                <div class="grid-container" id="series-grid"></div>
            </section>

            <!-- Cartoons Section -->
            <section id="cartoons-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg class="section-header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                        <h2>Мультфильмы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=cartoons" class="section-see-all">
                        <span>Все мультфильмы</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
                <div class="grid-container" id="cartoons-grid"></div>
            </section>

            <!-- Anime Section -->
            <section id="tvShows-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg class="section-header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        <h2 id="tvShows-title">Аниме</h2>
                    </div>
                    <a id="tvShows-see-all" href="../catalog/catalog.html?category=anime" class="section-see-all">
                        <span id="tvShows-see-all-text">Всё аниме</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
                <div class="grid-container" id="tvShows-grid"></div>
            </section>

        </div>
    </div>

    <!-- Scripts -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/services/QuotaTrackerService.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    <script defer src="../../shared/config/tmdb.config.js"></script>
    <script defer src="../../shared/utils/MediaClassifier.js"></script>
    <script defer src="../../shared/services/TMDBService.js"></script>
    <script defer src="../../shared/services/TmdbFallbackQueueService.js"></script>
    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/IdMappingService.js"></script>
    <script defer src="../../shared/services/HomeCacheService.js"></script>
    <script defer src="../../shared/services/KinopoiskPersonHtmlService.js"></script>
    <script defer src="../../shared/services/KinopoiskRatingParsingService.js"></script>
    <script defer src="../../shared/services/ImdbParsingService.js"></script>
    <script defer src="../../shared/services/MovieRatingsEnrichmentService.js"></script>
    <script defer src="../../shared/services/MovieCacheService.js"></script>
    <script defer src="../../shared/services/RatingService.js"></script>
    <script defer src="../../shared/services/RatingsCacheService.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>
    <script defer src="../../shared/services/ProfileService.js"></script>
    <script defer src="../../shared/errors/AppError.js"></script>
    <script defer src="../../shared/errors/ErrorRegistry.js"></script>
    <script defer src="../../shared/errors/modules/ProviderErrorModules.js"></script>
    <script defer src="../../shared/errors/ErrorNormalizer.js"></script>
    <script defer src="../../shared/errors/ErrorPresentation.js"></script>
    <script defer src="../../shared/errors/ErrorDialog.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="HomeMovieNavigationService.js"></script>
    <script defer src="HomeDataController.js"></script>
    <script defer src="FeaturedSliderController.js"></script>
    <script defer src="HomeRenderer.js"></script>
    <script type="module" src="../../shared/i18n/I18n.js"></script>
    <script defer src="home.js"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
