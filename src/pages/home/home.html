<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="home.page_title">Главная | MovieList Extension</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="home.css">

    <!-- Resource Hints -->
    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preconnect" href="https://us-central1-movielistdb-13208.cloudfunctions.net" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://image.tmdb.org">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>

    <div class="container">
        <!-- Loading State -->
        <div id="loader" class="loader-container app-loader app-loader--page" role="status" aria-live="polite">
            <div class="app-loader__indicator" aria-hidden="true"></div>
            <p class="app-loader__label" data-i18n="home.loading">Загрузка витрины...</p>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="error-container" style="display: none;">
            <div class="error-icon"><svg data-icon="WARNING" style="color: #ef4444;" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3.2L17.4 16H2.6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3.2L17.4 16H2.6ZM10 7H10A1 1 0 0 1 11 8V10.6A1 1 0 0 1 10 11.6H10A1 1 0 0 1 9 10.6V8A1 1 0 0 1 10 7ZM10 12.45A1.15 1.15 0 1 0 10 14.75A1.15 1.15 0 1 0 10 12.45Z"/></svg></div>
            <h2 data-i18n="home.error_title">Ошибка загрузки</h2>
            <p id="error-message" data-i18n="home.error_message">Не удалось загрузить данные</p>
            <button type="button" id="retry-btn" class="retry-button" data-i18n="home.retry">Повторить</button>
        </div>

        <!-- Content Area -->
        <div id="content" class="content-container" style="display: none;">
            <h1 class="home-visually-hidden" data-i18n="home.page_heading">Главная</h1>
            
            <!-- Featured Slider -->
            <section class="featured-slider-section" aria-roledescription="carousel" data-i18n="[aria-label]home.slider.label" aria-label="Популярное на этой неделе">
                <div class="featured-slider-container" id="featured-slider">
                    <!-- Featured slider items injected here -->
                </div>
                <!-- Pagination Dots -->
                <div class="slider-pagination" id="slider-pagination" role="group" data-i18n="[aria-label]home.slider.pages" aria-label="Страницы карусели">
                    <!-- Dots will be generated by JS -->
                </div>
            </section>

            <!-- Seasonal banner: shown only while SeasonalThemeService reports an active season -->
            <section id="season-banner" class="season-banner" aria-labelledby="season-banner-title" hidden>
                <div class="season-banner__scene" data-seasonal-scene="" aria-hidden="true"></div>
                <div class="season-banner__mark" data-seasonal-logo="" aria-hidden="true"></div>
                <div class="season-banner__text">
                    <h2 id="season-banner-title" class="season-banner__title"></h2>
                    <p class="season-banner__message"></p>
                </div>
                <a class="btn season-banner__cta" hidden></a>
                <button type="button" class="season-banner__close"><svg data-icon="CLOSE" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5L15 15M15 5L5 15"/></svg></button>
            </section>

            <!-- The New Year sign, built by the season's own script -->
            <div id="season-marquee" hidden></div>

            <!-- Personal Tier (CTA banner when logged out, Watching / Watchlist when logged in) -->
            <section id="personal-tier" class="personal-tier-section">
                <!-- Injected dynamically -->
            </section>

            <!-- Dashboard Section (Personal Statistics & Community Top) -->
            <section id="dashboard-section" class="dashboard-section" style="display: none;">
                <!-- Injected dynamically for logged in users -->
            </section>
            
            <!-- Because you rated: shown for signed-in users once recommendations resolve -->
            <section id="because-section" class="category-section" hidden>
                <div class="section-header">
                    <div class="section-header-title">
                        <h2 id="because-title"></h2>
                    </div>
                </div>
                <div class="grid-container" id="because-grid"></div>
            </section>

            <!-- Films Section -->
            <section id="films-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg data-icon="FILM" class="section-header-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M5 3H15A3 3 0 0 1 18 6V14A3 3 0 0 1 15 17H5A3 3 0 0 1 2 14V6A3 3 0 0 1 5 3ZM7.5 5H12.5A0.5 0.5 0 0 1 13 5.5V8.5A0.5 0.5 0 0 1 12.5 9H7.5A0.5 0.5 0 0 1 7 8.5V5.5A0.5 0.5 0 0 1 7.5 5ZM7.5 11H12.5A0.5 0.5 0 0 1 13 11.5V14.5A0.5 0.5 0 0 1 12.5 15H7.5A0.5 0.5 0 0 1 7 14.5V11.5A0.5 0.5 0 0 1 7.5 11ZM4 5H5A0.5 0.5 0 0 1 5.5 5.5V6.5A0.5 0.5 0 0 1 5 7H4A0.5 0.5 0 0 1 3.5 6.5V5.5A0.5 0.5 0 0 1 4 5ZM4 9H5A0.5 0.5 0 0 1 5.5 9.5V10.5A0.5 0.5 0 0 1 5 11H4A0.5 0.5 0 0 1 3.5 10.5V9.5A0.5 0.5 0 0 1 4 9ZM4 13H5A0.5 0.5 0 0 1 5.5 13.5V14.5A0.5 0.5 0 0 1 5 15H4A0.5 0.5 0 0 1 3.5 14.5V13.5A0.5 0.5 0 0 1 4 13ZM15 5H16A0.5 0.5 0 0 1 16.5 5.5V6.5A0.5 0.5 0 0 1 16 7H15A0.5 0.5 0 0 1 14.5 6.5V5.5A0.5 0.5 0 0 1 15 5ZM15 9H16A0.5 0.5 0 0 1 16.5 9.5V10.5A0.5 0.5 0 0 1 16 11H15A0.5 0.5 0 0 1 14.5 10.5V9.5A0.5 0.5 0 0 1 15 9ZM15 13H16A0.5 0.5 0 0 1 16.5 13.5V14.5A0.5 0.5 0 0 1 16 15H15A0.5 0.5 0 0 1 14.5 14.5V13.5A0.5 0.5 0 0 1 15 13Z"/></svg>
                        <h2 data-i18n="home.sections.films">Фильмы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=films" class="section-see-all">
                        <span data-i18n="home.see_all.films">Все фильмы</span>
                        <svg data-icon="ARROW_RIGHT" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10H16M11 5L16 10L11 15"/></svg>
                    </a>
                </div>
                <!-- Grid -->
                <div class="grid-container" id="films-grid">
                    <!-- Grid items injected here -->
                </div>
            </section>

            <!-- Series Section -->
            <section id="series-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg data-icon="TV" class="section-header-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.6 2L10 5L13.4 2"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H5A2 2 0 0 1 3 15V8A2 2 0 0 1 5 6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 6H15A2 2 0 0 1 17 8V15A2 2 0 0 1 15 17H12ZM14.6 8.4A1 1 0 1 0 14.6 10.4A1 1 0 1 0 14.6 8.4ZM14.6 11.8A1 1 0 1 0 14.6 13.8A1 1 0 1 0 14.6 11.8Z"/></svg>
                        <h2 data-i18n="home.sections.series">Сериалы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=series" class="section-see-all">
                        <span data-i18n="home.see_all.series">Все сериалы</span>
                        <svg data-icon="ARROW_RIGHT" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10H16M11 5L16 10L11 15"/></svg>
                    </a>
                </div>
                <div class="grid-container" id="series-grid"></div>
            </section>

            <!-- Cartoons Section -->
            <section id="cartoons-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg data-icon="PEN" class="section-header-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 1H13A1 1 0 0 1 14 2V4A1 1 0 0 1 13 5H7A1 1 0 0 1 6 4V2A1 1 0 0 1 7 1Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7H13L15 11L10 18L5 11Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 12V16"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 9.5A1.5 1.5 0 1 0 10 12.5A1.5 1.5 0 1 0 10 9.5Z"/></svg>
                        <h2 data-i18n="home.sections.cartoons">Мультфильмы</h2>
                    </div>
                    <a href="../catalog/catalog.html?category=cartoons" class="section-see-all">
                        <span data-i18n="home.see_all.cartoons">Все мультфильмы</span>
                        <svg data-icon="ARROW_RIGHT" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10H16M11 5L16 10L11 15"/></svg>
                    </a>
                </div>
                <div class="grid-container" id="cartoons-grid"></div>
            </section>

            <!-- Anime Section -->
            <section id="tvShows-section" class="category-section">
                <div class="section-header">
                    <div class="section-header-title">
                        <svg data-icon="BOLT" class="section-header-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 2.6L4.4 11H9.4L8.6 17.4L15.6 8.6H10.2Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M11 2.6L4.4 11H9.4L8.6 17.4L15.6 8.6H10.2Z"/></svg>
                        <h2 id="tvShows-title" data-i18n="home.sections.anime">Аниме</h2>
                    </div>
                    <a id="tvShows-see-all" href="../catalog/catalog.html?category=anime" class="section-see-all">
                        <span id="tvShows-see-all-text" data-i18n="home.see_all.anime">Всё аниме</span>
                        <svg data-icon="ARROW_RIGHT" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10H16M11 5L16 10L11 15"/></svg>
                    </a>
                </div>
                <div class="grid-container" id="tvShows-grid"></div>
            </section>

        </div>
    </div>

    <!-- Scripts -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>

    <script defer src="../../shared/services/TMDBService.js"></script>

    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/IdMappingService.js"></script>
    <script defer src="../../shared/services/HomeCacheService.js"></script>
    <script defer src="../../shared/services/RecommendationService.js"></script>
    <script defer src="../../shared/services/KinopoiskPersonHtmlService.js"></script>
    <script defer src="../../shared/services/KinopoiskRatingParsingService.js"></script>

    <script defer src="../../shared/services/MovieCacheService.js"></script>
    <script defer src="../../shared/config/rating.config.js"></script>
    <script defer src="../../shared/services/ExternalRatingSync.js"></script>
    <script defer src="../../shared/services/RatingService.js"></script>
    <script defer src="../../shared/services/RatingsCacheService.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>
    <script defer src="../../shared/services/ProfileService.js"></script>
    <script defer src="../../shared/errors/AppError.js"></script>
    <script defer src="../../shared/errors/ErrorRegistry.js"></script>
    <script defer src="../../shared/errors/modules/ProviderErrorModules.js"></script>

    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>

    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="HomeMovieNavigationService.js"></script>
    <script defer src="HomeDataController.js"></script>
    <script defer src="FeaturedSliderController.js"></script>
    <script defer src="HomeRenderer.js"></script>
    <script defer src="HomeSeasonalBanner.js"></script>
    <script type="module" src="../../shared/i18n/I18n.js"></script>
    <script defer src="home.js"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
