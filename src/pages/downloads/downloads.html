<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="downloads.page_title">Загрузки — Сеанс</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="downloads.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body class="dark-theme">
    <main class="main-content downloads-page">
        <div class="downloads-layout">
            <aside class="downloads-sidebar" aria-label="Загрузки" data-i18n="[aria-label]downloads.sidebar.label">
                <h2 class="downloads-sidebar__title" data-i18n="downloads.sidebar.title">Загрузки</h2>
                <nav class="downloads-filters" id="downloadsFilters" aria-label="Фильтр загрузок" data-i18n="[aria-label]downloads.sidebar.filters_label">
                    <button type="button" class="downloads-filter is-active" data-filter="all" aria-pressed="true">
                        <svg data-icon="LIST" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M4 3.5A1.5 1.5 0 1 0 4 6.5A1.5 1.5 0 1 0 4 3.5ZM4 8.5A1.5 1.5 0 1 0 4 11.5A1.5 1.5 0 1 0 4 8.5ZM4 13.5A1.5 1.5 0 1 0 4 16.5A1.5 1.5 0 1 0 4 13.5Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H17M9 10H17M9 15H17"/></svg>
                        <span class="downloads-filter__label" data-i18n="downloads.filters.all">Все</span>
                        <span class="downloads-filter__count" data-count="all">0</span>
                    </button>
                    <button type="button" class="downloads-filter" data-filter="active" aria-pressed="false">
                        <svg data-icon="DOWNLOADING" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3H14A3 3 0 0 1 17 6V14A3 3 0 0 1 14 17H6A3 3 0 0 1 3 14V6A3 3 0 0 1 6 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6.6V13M7.2 10.2L10 13L12.8 10.2"/></svg>
                        <span class="downloads-filter__label" data-i18n="downloads.filters.active">Качаются</span>
                        <span class="downloads-filter__count" data-count="active">0</span>
                    </button>
                    <button type="button" class="downloads-filter" data-filter="ready" aria-pressed="false">
                        <svg data-icon="WATCHED" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3H14A3 3 0 0 1 17 6V14A3 3 0 0 1 14 17H6A3 3 0 0 1 3 14V6A3 3 0 0 1 6 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.6 10.2L9 12.6L13.4 7.6"/></svg>
                        <span class="downloads-filter__label" data-i18n="downloads.filters.ready">Готовы</span>
                        <span class="downloads-filter__count" data-count="ready">0</span>
                    </button>
                    <button type="button" class="downloads-filter" data-filter="paused" aria-pressed="false">
                        <svg data-icon="PAUSED" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3H14A3 3 0 0 1 17 6V14A3 3 0 0 1 14 17H6A3 3 0 0 1 3 14V6A3 3 0 0 1 6 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7.6 7H8.4A0.6 0.6 0 0 1 9 7.6V12.4A0.6 0.6 0 0 1 8.4 13H7.6A0.6 0.6 0 0 1 7 12.4V7.6A0.6 0.6 0 0 1 7.6 7ZM11.6 7H12.4A0.6 0.6 0 0 1 13 7.6V12.4A0.6 0.6 0 0 1 12.4 13H11.6A0.6 0.6 0 0 1 11 12.4V7.6A0.6 0.6 0 0 1 11.6 7Z"/></svg>
                        <span class="downloads-filter__label" data-i18n="downloads.filters.paused">На паузе</span>
                        <span class="downloads-filter__count" data-count="paused">0</span>
                    </button>
                    <button type="button" class="downloads-filter" data-filter="error" aria-pressed="false">
                        <svg data-icon="WARNING" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3.2L17.4 16H2.6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3.2L17.4 16H2.6ZM10 7H10A1 1 0 0 1 11 8V10.6A1 1 0 0 1 10 11.6H10A1 1 0 0 1 9 10.6V8A1 1 0 0 1 10 7ZM10 12.45A1.15 1.15 0 1 0 10 14.75A1.15 1.15 0 1 0 10 12.45Z"/></svg>
                        <span class="downloads-filter__label" data-i18n="downloads.filters.error">Ошибки</span>
                        <span class="downloads-filter__count" data-count="error">0</span>
                    </button>
                </nav>

                <div class="downloads-sidebar__divider" role="presentation"></div>

                <section class="downloads-storage" aria-labelledby="downloadsStorageTitle">
                    <h3 class="downloads-storage__title" id="downloadsStorageTitle" data-i18n="downloads.storage.title">Хранилище</h3>
                    <p class="downloads-storage__path" id="downloadsFolder" hidden>
                        <svg data-icon="FOLDER" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M2 9V6A2 2 0 0 1 4 4H7.6A2 2 0 0 1 9 4.6L10.4 6H16A2 2 0 0 1 18 8V9Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9V14A2 2 0 0 0 5 16H15A2 2 0 0 0 17 14V9"/></svg>
                        <span id="downloadsFolderPath"></span>
                    </p>
                    <p class="downloads-storage__line"><span data-i18n="downloads.storage.used">Загрузки занимают</span> <strong id="downloadsUsed">—</strong></p>
                    <p class="downloads-storage__line" id="downloadsRetention" hidden></p>
                    <a class="downloads-storage__link" id="downloadsSettingsLink" href="../settings/settings.html?pane=mediaplayer" data-i18n="downloads.storage.settings_link">Папка и срок хранения</a>
                </section>
            </aside>

            <section class="downloads-content" aria-labelledby="downloadsTitle">
                <header class="downloads-header">
                    <h1 id="downloadsTitle" data-i18n="downloads.titles.all">Все загрузки</h1>
                    <div class="downloads-header__controls" id="downloadsControls">
                        <div class="downloads-search">
                            <input type="search" id="downloadsSearch" placeholder="Поиск в загрузках..." aria-label="Поиск в загрузках" autocomplete="off" data-i18n="downloads.controls.search_placeholder">
                            <svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg>
                        </div>
                        <label class="sort-control__label--sr-only" for="downloadsSort" data-i18n="downloads.controls.sort_label">Сортировка</label>
                        <select id="downloadsSort" data-sort-control class="custom-select">
                            <option value="activity" data-i18n="downloads.controls.sort_activity">Сначала активные</option>
                            <option value="created" data-i18n="downloads.controls.sort_created">Недавно добавленные</option>
                            <option value="title" data-i18n="downloads.controls.sort_title">Название (А–Я)</option>
                            <option value="size" data-i18n="downloads.controls.sort_size">Размер</option>
                        </select>
                    </div>
                </header>

                <div class="downloads-summary" id="downloadsSummary" role="status" aria-live="polite" hidden></div>

                <div class="downloads-banner" id="downloadsBanner" role="alert" hidden>
                    <svg data-icon="WARNING" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3.2L17.4 16H2.6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3.2L17.4 16H2.6ZM10 7H10A1 1 0 0 1 11 8V10.6A1 1 0 0 1 10 11.6H10A1 1 0 0 1 9 10.6V8A1 1 0 0 1 10 7ZM10 12.45A1.15 1.15 0 1 0 10 14.75A1.15 1.15 0 1 0 10 12.45Z"/></svg>
                    <p><span id="downloadsBannerTitle"></span><small id="downloadsBannerText"></small></p>
                    <button type="button" class="btn btn-secondary btn-sm" id="downloadsRetryBtn" data-i18n="downloads.banner.retry">Проверить сейчас</button>
                </div>

                <div class="downloads-toolbar" id="downloadsToolbar" hidden>
                    <label class="downloads-check downloads-check--all">
                        <input type="checkbox" id="downloadsSelectAll">
                        <span data-i18n="downloads.controls.select_all">Выбрать все</span>
                    </label>
                </div>

                <div class="downloads-loader app-loader app-loader--section" id="downloadsLoader" role="status" aria-live="polite">
                    <div class="app-loader__indicator" aria-label="Загружаем список" data-i18n="[aria-label]downloads.controls.loading"></div>
                </div>

                <div class="downloads-list" id="downloadsList" role="list" aria-labelledby="downloadsTitle"></div>
                <div class="downloads-empty" id="downloadsEmpty" hidden></div>
            </section>
        </div>

        <div class="downloads-bulkbar" id="downloadsBulkBar" role="region" aria-label="Действия с выбранными" data-i18n="[aria-label]downloads.bulk.label" hidden>
            <span class="downloads-bulkbar__count" id="downloadsBulkCount" aria-live="polite"></span>
            <div class="downloads-bulkbar__actions">
                <button type="button" class="btn btn-secondary btn-sm" data-bulk="pause" id="downloadsBulkPause" data-i18n="downloads.bulk.pause">Пауза</button>
                <button type="button" class="btn btn-secondary btn-sm" data-bulk="resume" id="downloadsBulkResume" data-i18n="downloads.bulk.resume">Продолжить</button>
                <button type="button" class="btn btn-danger btn-sm" data-bulk="delete" id="downloadsBulkDelete" data-i18n="downloads.bulk.delete">Удалить</button>
                <button type="button" class="btn btn-secondary btn-sm" data-bulk="clear" data-i18n="downloads.bulk.clear">Снять выделение</button>
            </div>
        </div>
    </main>

    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/TMDBService.js"></script>
    <script defer src="../../shared/services/IdMappingService.js"></script>
    <script defer src="../../shared/services/MediaPlayerService.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/SortControl.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="DownloadsLibraryModel.js"></script>
    <script type="module" src="downloads.js"></script>
</body>
</html>
