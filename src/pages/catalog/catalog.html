<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="catalog.page_title">Каталог — Сеанс</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="../../shared/styles/filter-controls.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/CursorService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>
    <main class="catalog-page" id="catalogPage">
        <div class="catalog-shell">
            <header class="catalog-hero">
                <div class="catalog-hero__eyebrow" data-i18n="catalog.eyebrow">КАТАЛОГ / DISCOVERY</div>
                <div class="catalog-hero__row">
                    <div>
                        <h1 id="catalogTitle" data-i18n="catalog.categories.films.title">Все фильмы</h1>
                        <p id="catalogDescription" data-i18n="catalog.categories.films.description">Игровые фильмы без анимации</p>
                    </div>
                    <div class="catalog-hero__count" id="catalogCount" aria-live="polite" data-count-label="результатов" data-i18n="[data-count-label]catalog.count_label">—</div>
                </div>
            </header>

            <nav class="catalog-tabs" aria-label="Направление каталога" data-i18n="[aria-label]catalog.tabs_label">
                <a href="catalog.html?category=films" data-catalog-category="films" data-i18n="catalog.tabs.films">Фильмы</a>
                <a href="catalog.html?category=series" data-catalog-category="series" data-i18n="catalog.tabs.series">Сериалы</a>
                <a href="catalog.html?category=cartoons" data-catalog-category="cartoons" data-i18n="catalog.tabs.cartoons">Мультфильмы</a>
                <a href="catalog.html?category=anime" data-catalog-category="anime" data-i18n="catalog.tabs.anime">Аниме</a>
            </nav>

            <section class="catalog-controls filter-panel" aria-label="Фильтры каталога" data-i18n="[aria-label]catalog.filters_label">
                <div class="catalog-control catalog-control--wide">
                    <label for="catalogSort" data-i18n="catalog.sort_label">Сортировка</label>
                    <select id="catalogSort" data-sort-control>
                        <option value="popularity.desc" data-i18n="catalog.sort.popular">Популярные</option>
                        <option value="vote_average.desc" data-i18n="catalog.sort.rating">По рейтингу</option>
                        <option value="primary_release_date.desc" data-i18n="catalog.sort.newest_films">Новые фильмы</option>
                    </select>
                </div>
                <div class="catalog-control">
                    <label for="catalogYearFrom" data-i18n="catalog.year_from">Год от</label>
                    <input id="catalogYearFrom" type="number" min="1870" max="2100" inputmode="numeric" placeholder="—" aria-label="Год от" data-i18n="[aria-label]catalog.year_from">
                </div>
                <div class="catalog-control">
                    <label for="catalogYearTo" data-i18n="catalog.year_to">Год до</label>
                    <input id="catalogYearTo" type="number" min="1870" max="2100" inputmode="numeric" placeholder="—" aria-label="Год до" data-i18n="[aria-label]catalog.year_to">
                </div>
                <div class="catalog-control catalog-control--wide">
                    <label for="catalogGenre" data-i18n="catalog.genre_label">Жанр</label>
                    <select id="catalogGenre" data-filter-control>
                        <option value="" data-i18n="catalog.genres.all">Все жанры</option>
                        <option value="28" data-i18n="catalog.genres.action">Боевик</option>
                        <option value="12" data-i18n="catalog.genres.adventure">Приключения</option>
                        <option value="35" data-i18n="catalog.genres.comedy">Комедия</option>
                        <option value="80" data-i18n="catalog.genres.crime">Криминал</option>
                        <option value="18" data-i18n="catalog.genres.drama">Драма</option>
                        <option value="14" data-i18n="catalog.genres.fantasy">Фэнтези</option>
                        <option value="27" data-i18n="catalog.genres.horror">Ужасы</option>
                        <option value="9648" data-i18n="catalog.genres.mystery">Детектив</option>
                        <option value="10749" data-i18n="catalog.genres.romance">Мелодрама</option>
                        <option value="878" data-i18n="catalog.genres.science_fiction">Фантастика</option>
                        <option value="53" data-i18n="catalog.genres.thriller">Триллер</option>
                    </select>
                </div>
                <div class="catalog-control catalog-control--country">
                    <label for="catalogCountry" data-i18n="catalog.country_label">Страна</label>
                    <input id="catalogCountry" class="filter-field" type="text" maxlength="2" pattern="[A-Za-z]{2}" placeholder="RU" aria-label="Код страны, например RU" data-i18n="[aria-label]catalog.country_aria">
                </div>
                <button class="catalog-reset" id="catalogReset" type="button" data-i18n="catalog.reset">Сбросить</button>
            </section>

            <div class="catalog-status" id="catalogStatus" role="status" aria-live="polite"></div>

            <section class="catalog-results" aria-label="Фильмы каталога" data-i18n="[aria-label]catalog.results_label">
                <div class="catalog-grid" id="catalogGrid"></div>
                <div class="catalog-empty" id="catalogEmpty" hidden>
                    <div class="catalog-empty__mark">∅</div>
                    <h2 data-i18n="catalog.empty_title">Ничего не найдено</h2>
                    <p data-i18n="catalog.empty_text">Измени фильтры или попробуй другое направление.</p>
                    <button class="catalog-action" id="catalogEmptyReset" type="button" data-i18n="catalog.empty_reset">Сбросить фильтры</button>
                </div>
                <div class="catalog-error" id="catalogError" hidden>
                    <h2 data-i18n="catalog.error_title">Каталог временно недоступен</h2>
                    <p id="catalogErrorMessage" data-i18n="catalog.error_text">Не удалось загрузить эту страницу.</p>
                    <button class="catalog-action" id="catalogRetry" type="button" data-i18n="catalog.retry">Повторить</button>
                </div>
            </section>

            <div class="catalog-load-more" id="catalogLoadMore" hidden>
                <button class="catalog-action catalog-action--primary" id="catalogLoadMoreButton" type="button" data-i18n="catalog.load_more">Загрузить ещё</button>
            </div>
            <div class="catalog-sentinel" id="catalogSentinel" aria-hidden="true"></div>
            <div class="catalog-progress" id="catalogProgress" hidden>
                <span class="catalog-progress__dot"></span>
                <span data-i18n="catalog.loading_next">Загружаем следующую страницу</span>
            </div>
        </div>
    </main>

    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/QuotaTrackerService.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    <script defer src="../../shared/config/catalogCategories.js"></script>
    <script defer src="../../shared/utils/MediaClassifier.js"></script>
    <script defer src="../../shared/services/TMDBService.js"></script>
    <script defer src="../../shared/services/KinopoiskGraphqlService.js"></script>
    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/KinopoiskPersonHtmlService.js"></script>
    <script defer src="../../shared/services/KinopoiskRatingParsingService.js"></script>
    <script defer src="../../shared/services/ImdbParsingService.js"></script>
    <script defer src="../../shared/services/MovieRatingsEnrichmentService.js"></script>
    <script defer src="../../shared/services/CatalogService.js"></script>
    <script defer src="../../shared/errors/AppError.js"></script>
    <script defer src="../../shared/errors/ErrorRegistry.js"></script>
    <script defer src="../../shared/errors/modules/ProviderErrorModules.js"></script>
    <script defer src="../../shared/errors/ErrorNormalizer.js"></script>
    <script defer src="../../shared/errors/ErrorPresentation.js"></script>
    <script defer src="../../shared/errors/ErrorDialog.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="../home/HomeMovieNavigationService.js"></script>
    <script defer src="../home/HomeRenderer.js"></script>
    <script type="module" src="../../shared/i18n/I18n.js"></script>
    <script defer src="../../shared/components/SortControl.js"></script>
    <script defer src="../../shared/components/FilterControls.js"></script>
    <script defer src="catalog.js"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
