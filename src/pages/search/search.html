<!DOCTYPE html>
<html lang="en" data-provider-ratings-backfill="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.titles.search">Поиск — Сеанс</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/router.css">
    <link rel="stylesheet" href="../../shared/styles/search.css">
    <link rel="stylesheet" href="../../shared/styles/filter-controls.css">
    <link rel="stylesheet" href="../../shared/styles/poster-fixes.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">

    <!-- Resource Hints -->
    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preload" as="script" href="../../../libs/firebase-firestore-compat.js">
    <link rel="preconnect" href="https://firebaseio.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <script src="search-boot.js"></script>
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/CursorService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>
    <!-- Navigation will be inserted here by Navigation.js -->
    
    <div class="search-container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-form">
                <h1 class="search-page-title" data-i18n="search.hero_badge">Поиск фильмов и сериалов</h1>

                <div class="search-input-container">
                    <div class="search-input-wrapper">
                        <span class="search-input-icon">
                            <svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg>
                        </span>
                        <input type="text" id="searchInput" class="search-input" data-i18n="search.placeholder" placeholder="Search for movies...">
                        <button type="button" id="clearSearchInputBtn" class="clear-search-input-btn" data-i18n="[aria-label]search.clear_input" aria-label="Очистить поле поиска">
                            <svg data-icon="CLOSE" aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5L15 15M15 5L5 15"/></svg>
                        </button>

                        <!-- Search History Dropdown -->
                        <div id="searchHistoryDropdown" class="search-history-dropdown" style="display: none;">
                            <div class="search-history-header">
                                <span class="history-title" data-i18n="search.recent_searches">Recent Searches</span>
                                <button type="button" id="clearHistoryBtn" class="clear-history-btn" data-i18n="[title]search.clear_history" title="Clear all history">
                                    <span class="clear-icon"><svg data-icon="TRASH" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 4V3A1 1 0 0 1 8 2H12A1 1 0 0 1 13 3V4H16A1 1 0 0 1 17 5V6A1 1 0 0 1 16 7H4A1 1 0 0 1 3 6V5A1 1 0 0 1 4 4Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8V15A2 2 0 0 0 7 17H13A2 2 0 0 0 15 15V8M10 10V13"/></svg></span>
                                </button>
                            </div>
                            <div id="searchHistoryList" class="search-history-list">
                                <!-- History items will be populated here -->
                            </div>
                            <div id="searchHistoryEmpty" class="search-history-empty" style="display: none;">
                                <span class="empty-icon"><svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg></span>
                                <span class="empty-text" data-i18n="search.no_recent">No recent searches</span>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="toggleFiltersBtn" class="btn btn-secondary btn-filters" aria-expanded="false" aria-controls="filters">
                        <span class="btn-icon"><svg data-icon="FILTER" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4H17L12 10.4V16L8 14V10.4Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 4L10 15L12 16L12 10.4L17 4L10 4Z"/></svg></span>
                        <span data-i18n="search.filters_btn">Фильтры</span>
                        <span class="filters-count" id="filtersCount" hidden></span>
                    </button>

                    <button type="button" id="searchBtn" class="btn btn-primary btn-search">
                        <span class="btn-icon"><svg data-icon="SEARCH" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg></span>
                        <span data-i18n="search.search_btn">Поиск</span>
                    </button>
                </div>

                <!-- Filters -->
                <div class="filters filter-panel" id="filters" style="display: none;">
                    <div class="filter-section">
                        <div class="filter-group filter-section year-range-group">
                            <label class="filter-label" data-i18n="search.year_range">Year Range:</label>
                            <div class="year-range-inputs">
                                <input type="number" id="yearFromFilter" class="form-input year-input" data-i18n="[placeholder]search.from" placeholder="From" min="1900" max="2030">
                                <span class="year-separator">—</span>
                                <input type="number" id="yearToFilter" class="form-input year-input" data-i18n="[placeholder]search.to" placeholder="To" min="1900" max="2030">
                            </div>
                        </div>

                        <div class="filter-disclosures">
                        <details class="filter-disclosure" id="genreFilterSection">
                            <summary class="filter-disclosure__summary disclosure-summary">
                                <span class="filter-disclosure__label" data-i18n="search.genres">Genres</span>
                                <span class="filter-disclosure__selection"></span>
                            </summary>
                            <div class="filter-disclosure__content"><div id="genreCheckboxes"></div></div>
                        </details>

                        <details class="filter-disclosure" id="countryFilterSection">
                            <summary class="filter-disclosure__summary disclosure-summary">
                                <span class="filter-disclosure__label" data-i18n="search.countries">Countries</span>
                                <span class="filter-disclosure__selection"></span>
                            </summary>
                            <div class="filter-disclosure__content"><div id="countryCheckboxes"></div></div>
                        </details>
                        </div>

                        <div class="filter-actions">
                            <button type="button" id="clearFiltersBtn" class="btn btn-ghost" data-i18n="search.clear_filters">Clear Filters</button>
                            <button type="button" id="applyFiltersBtn" class="btn btn-secondary" data-i18n="search.apply_filters">Apply Filters</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header" id="resultsHeader" style="display: none;">
                <h2 class="results-title" data-i18n="search.results_title">Search Results</h2>
                <div class="results-info" id="resultsInfo"></div>
            </div>
            
            <div class="results-grid" id="resultsGrid">
                <div class="empty-state" data-initial>
                    <div class="empty-state-icon"><svg data-icon="SEARCH" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3A6 6 0 1 0 9 15A6 6 0 1 0 9 3Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9 3L9 15C12.32 15 15 12.31 15 9C15 5.69 12.32 3 9 3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13.6 13.6L17.6 17.6"/></svg></div>
                    <h3 class="empty-state-title" data-i18n="search.empty_title">Search for movies</h3>
                    <p class="empty-state-text" data-i18n="search.empty_text">Enter a movie title to start searching</p>
                </div>
            </div>
            
            <!-- Infinite Scroll Trigger Sentinel -->
            <div id="infiniteScrollTrigger" class="infinite-scroll-trigger" style="display: none;">
                <div class="app-loader app-loader--compact" role="status" aria-live="polite">
                    <div class="app-loader__indicator" aria-hidden="true"></div>
                    <span class="app-loader__label" data-i18n="search.loading_more">Загрузка фильмов...</span>
                </div>
            </div>

            <!-- End of Results Indicator -->
            <div id="searchEndOfResults" class="search-end-of-results" style="display: none;">
                <span class="end-icon">
                    <svg data-icon="FILM" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M5 3H15A3 3 0 0 1 18 6V14A3 3 0 0 1 15 17H5A3 3 0 0 1 2 14V6A3 3 0 0 1 5 3ZM7.5 5H12.5A0.5 0.5 0 0 1 13 5.5V8.5A0.5 0.5 0 0 1 12.5 9H7.5A0.5 0.5 0 0 1 7 8.5V5.5A0.5 0.5 0 0 1 7.5 5ZM7.5 11H12.5A0.5 0.5 0 0 1 13 11.5V14.5A0.5 0.5 0 0 1 12.5 15H7.5A0.5 0.5 0 0 1 7 14.5V11.5A0.5 0.5 0 0 1 7.5 11ZM4 5H5A0.5 0.5 0 0 1 5.5 5.5V6.5A0.5 0.5 0 0 1 5 7H4A0.5 0.5 0 0 1 3.5 6.5V5.5A0.5 0.5 0 0 1 4 5ZM4 9H5A0.5 0.5 0 0 1 5.5 9.5V10.5A0.5 0.5 0 0 1 5 11H4A0.5 0.5 0 0 1 3.5 10.5V9.5A0.5 0.5 0 0 1 4 9ZM4 13H5A0.5 0.5 0 0 1 5.5 13.5V14.5A0.5 0.5 0 0 1 5 15H4A0.5 0.5 0 0 1 3.5 14.5V13.5A0.5 0.5 0 0 1 4 13ZM15 5H16A0.5 0.5 0 0 1 16.5 5.5V6.5A0.5 0.5 0 0 1 16 7H15A0.5 0.5 0 0 1 14.5 6.5V5.5A0.5 0.5 0 0 1 15 5ZM15 9H16A0.5 0.5 0 0 1 16.5 9.5V10.5A0.5 0.5 0 0 1 16 11H15A0.5 0.5 0 0 1 14.5 10.5V9.5A0.5 0.5 0 0 1 15 9ZM15 13H16A0.5 0.5 0 0 1 16.5 13.5V14.5A0.5 0.5 0 0 1 16 15H15A0.5 0.5 0 0 1 14.5 14.5V13.5A0.5 0.5 0 0 1 15 13Z"/></svg>
                </span>
                <span class="end-text" data-i18n="search.all_shown">Все найденные фильмы показаны</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    <script defer src="../../shared/utils/RussianStemmer.js"></script>
    <script defer src="../../shared/services/TMDBService.js"></script>
    <script defer src="../../shared/services/TmdbFallbackQueueService.js"></script>
    <script defer src="../../shared/services/KinopoiskGraphqlService.js"></script>
    <script defer src="../../shared/services/KinopoiskService.js"></script>
    <script defer src="../../shared/services/ImdbParsingService.js"></script>
    <script defer src="../../shared/services/MovieCacheService.js"></script>
    <script defer src="../../shared/config/rating.config.js"></script>
    <script defer src="../../shared/services/ExternalRatingSync.js"></script>
    <script defer src="../../shared/services/RatingService.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>
    <script defer src="../../shared/services/SearchHistoryService.js"></script>
    <script defer src="../../shared/config/catalogCategories.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/components/Router.js"></script>
    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/components/MovieCard.js"></script>
    <script defer src="../../shared/components/MovieCardActions.js"></script>
    <script defer src="../../shared/services/RatingsRefreshService.js"></script>
    <script defer src="../../shared/services/ProviderRatingsBackfill.js"></script>
    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/config/discoveryFilters.js"></script>
    <script defer src="../../shared/components/FilterControls.js"></script>
    <script defer src="search.js" type="module"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
