<body>
    <!-- Navigation will be inserted here by Navigation.js -->
    
    <!-- Person Details Container -->
    <main class="person-details-page-container" id="personDetailsMain">
        <!-- Loading State -->
        <div class="loading-state app-loader app-loader--page" id="loadingState" role="status" aria-live="polite">
            <div class="app-loader__indicator" aria-hidden="true"></div>
            <h3 class="loading-title app-loader__label" data-i18n="person_details.loading">Загрузка информации о персоне...</h3>
            <p class="loading-text app-loader__label" data-i18n="person_details.wait">Пожалуйста, подождите</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState" style="display: none;" role="alert">
            <div class="error-icon">
                <svg data-icon="WARNING" style="color: #ef4444;" aria-hidden="true" width="40" height="40" viewBox="0 0 20 20" fill="none"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3.2L17.4 16H2.6Z"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 3.2L17.4 16H2.6ZM10 7H10A1 1 0 0 1 11 8V10.6A1 1 0 0 1 10 11.6H10A1 1 0 0 1 9 10.6V8A1 1 0 0 1 10 7ZM10 12.45A1.15 1.15 0 1 0 10 14.75A1.15 1.15 0 1 0 10 12.45Z"/></svg>
            </div>
            <h2 class="error-title" id="errorTitle" data-i18n="person_details.error_title">Информация не найдена</h2>
            <p class="error-message" id="errorMessage" data-i18n="person_details.error_text">Не удалось загрузить информацию о персоне</p>
            <div class="error-actions">
                <button type="button" class="btn btn-secondary" id="errorBackBtn" data-i18n="person_details.back">Назад</button>
                <a href="../home/home.html" class="btn btn-primary" id="errorHomeBtn" data-i18n="person_details.home">На главную</a>
            </div>
        </div>
        
        <!-- Person Content Container -->
        <div class="person-details-content" id="personDetailsContainer" style="display: none;">
            <!-- Rendered dynamically by person-details.js -->
        </div>
    </main>

    <!-- Scripts -->
    <script defer src="../../../libs/firebase-app-compat.js"></script>
