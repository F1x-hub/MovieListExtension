<!DOCTYPE html>
<html lang="en" data-provider-ratings-backfill="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - Movie Rating Extension</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/router.css">
    <link rel="stylesheet" href="../../shared/styles/search.css">
    <link rel="stylesheet" href="../../shared/styles/movie-card.css">
    <link rel="stylesheet" href="../../shared/styles/watchlist.css">
    <link rel="stylesheet" href="../../shared/styles/filter-controls.css">
    
    <!-- Firebase -->
    <script src="../../../libs/firebase-app-compat.js"></script>
    <script src="../../../libs/firebase-auth-compat.js"></script>
    <script src="../../../libs/firebase-firestore-compat.js"></script>
    
    <!-- Services -->
    <script src="../../shared/firestore.js"></script>
    <script src="../../shared/config/kinopoisk.config.js"></script>
    <script src="../../shared/services/RatingsCacheService.js"></script>
    <script src="../../shared/config/rating.config.js"></script>
    <script src="../../shared/services/ExternalRatingSync.js"></script>
    <script src="../../shared/services/RatingService.js"></script>
    <script src="../../shared/services/MovieCacheService.js"></script>
    <script src="../../shared/services/TmdbFallbackQueueService.js"></script>
    <script src="../../shared/services/KinopoiskGraphqlService.js"></script>
    <script src="../../shared/services/KinopoiskService.js"></script>
    <script src="../../shared/services/UserService.js"></script>
    <script src="../../shared/services/WatchlistService.js"></script>
    <script src="../../shared/services/WatchingService.js"></script>
    <script src="../../shared/services/FavoriteService.js"></script>
    <script src="../../shared/services/CollectionService.js"></script>
    <script src="../../shared/utils/Utils.js"></script>
    <script src="../../shared/utils/IconUtils.js"></script>
    <script src="../../shared/utils/Icons.js"></script>
    
    <!-- Components -->
    <script src="../../shared/components/MovieCard.js"></script>
    <script src="../../shared/services/RatingsRefreshService.js"></script>
    <script src="../../shared/services/ProviderRatingsBackfill.js"></script>
    <script src="../../shared/components/BackToTop.js"></script>
    <script src="../../shared/components/Navigation.js"></script>
    <script src="../../shared/components/Router.js"></script>
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <script src="../../shared/services/ThemeService.js"></script>
    <script src="../../shared/services/SeasonalThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>
    <!-- Navigation will be inserted here by Navigation.js -->
    
    <!-- Main Content -->
    <main class="watchlist-main">
        <div class="watchlist-container">
            <!-- Page Header -->
            <div class="watchlist-header">
                <h1 class="watchlist-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #667eea; margin-right: 8px; vertical-align: middle;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Watching - Смотрю</h1>
                <p class="watchlist-subtitle">Фильмы, которые вы смотрите сейчас</p>
            </div>

            <!-- Filters Section -->
            <div class="filters-section filter-panel">
                <div class="filters-header">
                    <h3 class="filters-title">Filters & Search</h3>
                </div>

                <div class="filters-grid">
                    <!-- Search -->
                    <div class="filter-group">
                        <label class="filter-label">Search in Watching</label>
                        <div class="search-input-wrapper">
                            <input type="text" class="search-input" id="watchingSearchInput" placeholder="Поиск в Watching...">
                            <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                        </div>
                    </div>

                    <!-- Sort Options -->
                    <div class="filter-group">
                        <label class="filter-label" for="sortFilter" data-i18n="ratings.filters.sort">Sort By</label>
                        <select id="sortFilter" data-sort-control>
                            <option value="addedAt-desc" data-i18n="ratings.sort.date_newest">Date Added (Newest)</option>
                            <option value="addedAt-asc" data-i18n="ratings.sort.date_oldest">Date Added (Oldest)</option>
                            <option value="movieTitle-asc" data-i18n="ratings.sort.title_az">Title (A-Z)</option>
                            <option value="movieTitle-desc" data-i18n="ratings.sort.title_za">Title (Z-A)</option>
                            <option value="releaseYear-desc" data-i18n="ratings.sort.year_newest">Year (Newest)</option>
                            <option value="releaseYear-asc" data-i18n="ratings.sort.year_oldest">Year (Oldest)</option>
                            <option value="avgRating-desc" data-i18n="ratings.sort.avg_high">Avg Rating (High to Low)</option>
                            <option value="avgRating-asc" data-i18n="ratings.sort.avg_low">Avg Rating (Low to High)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Results Info -->
            <div class="results-info" id="resultsInfo">
                <span class="results-count" id="resultsCount">Loading...</span>
            </div>

            <!-- Loading State -->
            <div class="loading-section app-loader app-loader--page app-loader--skeleton" id="loadingSection" role="status" aria-live="polite">
                <div class="skeleton-grid" aria-hidden="true">
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                    <div class="skeleton-card"><div class="skeleton-card__poster"></div><div class="skeleton-card__lines"><span></span><span></span><span></span></div></div>
                </div>
                <p class="app-loader__label">Loading your watching list...</p>
            </div>

            <!-- Movies Grid -->
            <div class="movies-grid" id="moviesGrid">
                <!-- Movie cards will be inserted here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
                <h3 class="empty-state-title">Ваш список "Смотрю" пуст</h3>
                <p class="empty-state-text">Добавьте фильмы, которые вы смотрите!</p>
                <button class="empty-state-btn" onmousedown="window.navigation?.navigateToPage('search')">
                    Найти фильмы
                </button>
            </div>

            <!-- Error State -->
            <div class="error-state" id="errorState" style="display: none;">
                <div class="error-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ef4444;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                <h3 class="error-state-title">Something went wrong</h3>
                <p class="error-state-text" id="errorMessage">Failed to load watching list</p>
                <button class="error-state-btn" id="retryBtn">Try Again</button>
            </div>
        </div>
    </main>

    <!-- Main Script -->
    <script src="../../shared/components/ConfirmDialog.js"></script>
    <script src="../../shared/components/SortControl.js"></script>
    <script src="watching.js"></script>
    <script defer src="../../shared/components/ReportWidget.js"></script>
</body>
</html>
