<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эфир - Movie Rating Extension</title>

    <link rel="stylesheet" href="../../shared/styles/common.css">
    <script defer src="../../shared/components/NumberStepper.js"></script>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <link rel="stylesheet" href="../../shared/styles/navigation.css">
    <link rel="stylesheet" href="../../shared/styles/router.css">
    <link rel="stylesheet" href="../../shared/styles/report-widget.css">
    <link rel="stylesheet" href="live.css">

    <link rel="preload" as="script" href="../../../libs/firebase-app-compat.js">
    <link rel="preload" as="script" href="../../../libs/firebase-firestore-compat.js">
    <script src="../../shared/services/ThemeService.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="../../shared/assets/icons/app/favicon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../shared/assets/icons/app/favicon32.png">
</head>
<body>
    <!-- Navigation will be inserted here by Navigation.js -->

    <main class="live-root">
        <header class="live-header">
            <div class="live-heading">
                <span class="live-badge" id="liveBadge" hidden><span class="live-badge__dot" aria-hidden="true"></span><span id="liveBadgeText">В эфире</span></span>
                <h1 class="live-title" id="liveTitle">Эфир</h1>
                <p class="live-subtitle" id="liveSubtitle">Общий показ для всех: заходите — и смотрите с того же момента, что и остальные.</p>
            </div>
            <div class="live-meta">
                <span class="live-clock" id="liveClock" hidden></span>
                <button type="button" class="btn btn-secondary live-sync-btn" id="liveRelayWatchBtn" hidden>Смотреть трансляцию ведущего</button>
                <button type="button" class="btn btn-secondary live-sync-btn" id="liveRelayHostBtn" hidden>Транслировать мою вкладку</button>
            </div>
        </header>

        <p class="live-notice" id="liveNotice" role="status" hidden></p>

        <section class="live-stage" id="liveStage" aria-live="polite">
            <!-- Viewer controls for streams without their own player chrome (relay, YouTube). -->
            <div class="live-controls" id="liveControls" hidden>
                <button type="button" class="live-control" id="liveMuteBtn" aria-label="Выключить звук"><svg class="live-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg><svg class="live-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg></button>
                <input type="range" class="live-volume" id="liveVolume" min="0" max="1" step="0.05" value="1" aria-label="Громкость">
                <span class="live-controls__spacer"></span>
                <button type="button" class="live-control" id="liveFullscreenBtn" aria-label="На весь экран"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
            </div>
            <div class="live-screen" id="liveScreen">
                <div class="app-loader app-loader--section" id="liveLoading" role="status">
                    <div class="app-loader__indicator" aria-hidden="true"></div>
                    <p class="app-loader__label">Подключаемся к эфиру…</p>
                </div>
            </div>
        </section>

        <div class="empty-state live-empty" id="liveEmpty" hidden>
            <div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg></div>
            <h3 class="empty-state-title" id="liveEmptyTitle">Сейчас ничего не идёт</h3>
            <p class="empty-state-text" id="liveEmptyText">Когда начнётся показ, он появится здесь автоматически — страницу обновлять не нужно.</p>
        </div>
    </main>

    <script defer src="../../../libs/firebase-app-compat.js"></script>
    <script defer src="../../../libs/firebase-auth-compat.js"></script>
    <script defer src="../../../libs/firebase-firestore-compat.js"></script>

    <script defer src="../../shared/firestore.js"></script>
    <script defer src="../../shared/config/kinopoisk.config.js"></script>
    <script defer src="../../shared/config/player.config.js"></script>
    <script defer src="../../shared/services/UserService.js"></script>
    <script defer src="../../shared/services/WatchlistService.js"></script>
    <script defer src="../../shared/services/WatchingService.js"></script>
    <script defer src="../../shared/services/FavoriteService.js"></script>
    <script defer src="../../shared/services/CollectionService.js"></script>
    <script defer src="../../shared/utils/Utils.js"></script>
    <script defer src="../../shared/utils/IconUtils.js"></script>
    <script defer src="../../shared/utils/Icons.js"></script>
    <script defer src="../../shared/components/BackToTop.js"></script>
    <script defer src="../../shared/components/ConfirmDialog.js"></script>
    <script defer src="../../shared/components/Navigation.js"></script>
    <script defer src="../../shared/services/CinemaChannelService.js"></script>
    <script defer src="../../shared/services/LiveRelayService.js"></script>
    <script defer src="live.js"></script>
</body>
</html>
