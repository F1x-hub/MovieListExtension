  <rect
    x="32"
    y="251"
    width="22"
    height="28"
    rx="2"
    fill="#8C9199"/>

  <rect
    x="31"
    y="258"
    width="24"
    height="3"
    fill="#595E66"/>

  <rect
    x="31"
    y="268"
    width="24"
    height="3"
    fill="#595E66"/>

  <rect
    x="33"
    y="279"
    width="20"
    height="65"
    rx="2"
    fill="#80858C"/>

  <circle
    cx="57"
    cy="296"
    r="3"
    fill="#E62626"/>

  <rect
    x="33"
    y="311"
    width="20"
    height="2"
    fill="#61666E"/>

  <rect
    x="33"
    y="318"
    width="20"
    height="2"
    fill="#61666E"/>

  <rect
    x="33"
    y="325"
    width="20"
    height="2"
    fill="#61666E"/>

  <rect
    x="33"
