  <!-- Внешнее свечение -->
  <g filter="url(#filter0_f_1_2)">
    <path
      d="M 43 245 C 43 178 47 112 67 88 C 80 72 98 74 103 90 C 106 101 104 109 103 115"
      stroke="#4DB3FF"
      stroke-opacity="0.25"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>
  </g>

  <!-- Внутреннее голубое свечение -->
  <g filter="url(#filter1_f_1_2)">
    <path
      d="M 43 245 C 43 178 47 112 67 88 C 80 72 98 74 103 90 C 106 101 104 109 103 115"
      stroke="#66CCFF"
      stroke-opacity="0.6"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>
  </g>

  <!-- Светлое ядро клинка -->
  <g filter="url(#filter2_d_1_2)">
    <path
      d="M 43 245 C 43 178 47 112 67 88 C 80 72 98 74 103 90 C 106 101 104 109 103 115"
      stroke="#E0F5FF"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>
  </g>

  <!-- ===================== -->
  <!--       РУКОЯТЬ          -->
  <!-- ===================== -->

  <rect
    x="29"
    y="241"
    width="28"
    height="10"
    rx="2"
