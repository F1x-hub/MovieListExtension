<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin-when-cross-origin">
    <title>StartTab Player Wrapper</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-elevated: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Skeleton */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 2;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error & Fallback UI */
        .error-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            z-index: 3;
        }

        .error-card.visible {
            display: flex;
        }

        .error-card__backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .error-card__content {
            position: relative;
            z-index: 2;
            max-width: 440px;
            padding: 24px;
            text-align: center;
            background: rgba(24, 24, 27, 0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .error-card__icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card__title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .error-card__desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .error-card__btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--accent);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            margin-top: 4px;
        }

        .error-card__btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .error-card__btn:active {
            transform: translateY(0);
        }

        .error-card__btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loader Skeleton -->
        <div id="loader" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">Загрузка плеера...</div>
        </div>

        <!-- YouTube Player Container -->
        <div id="player-container">
            <div id="player"></div>
        </div>

        <!-- Error / Blocked Embed Fallback -->
        <div id="error-card" class="error-card">
            <div class="error-card__backdrop"></div>
            <div class="error-card__content">
                <div class="error-card__icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
                <h3 id="error-title" class="error-card__title">Воспроизведение ограничено</h3>
                <p id="error-desc" class="error-card__desc">
                    Правообладатель отключил возможность воспроизведения этого видео на сторонних сайтах.
                </p>
                <a id="error-link" class="error-card__btn" href="#" target="_blank" rel="noopener noreferrer">
                    <span>Смотреть на YouTube</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6v2H5v11h11v-5h2v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6zm11-3v8h-2V5.414l-7.293 7.293-1.414-1.414L17.586 4H13V2h8a1 1 0 0 1 1 1z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v') || urlParams.get('video') || '';
            const autoplay = urlParams.get('autoplay') !== '0' ? 1 : 0;
            const mute = urlParams.get('mute') === '1' ? 1 : 0;
            const startSec = parseInt(urlParams.get('t') || urlParams.get('start') || '0', 10) || 0;
            const controls = urlParams.get('controls') !== '0' ? 1 : 0;

            const loaderEl = document.getElementById('loader');
            const errorCardEl = document.getElementById('error-card');
            const errorTitleEl = document.getElementById('error-title');
            const errorDescEl = document.getElementById('error-desc');
            const errorLinkEl = document.getElementById('error-link');

            let ytPlayer = null;
            let timeUpdateInterval = null;

            // Set direct YouTube watch link
            if (videoId) {
                errorLinkEl.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
                errorCardEl.style.backgroundImage = `url(https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg)`;
            }

            // Communication Bridge: Send message to parent (Chrome Extension)
            function emitToParent(event, payload) {
                try {
                    window.parent.postMessage({
                        source: 'STARTTAB_PLAYER_WRAPPER',
                        event: event,
                        videoId: videoId,
                        payload: payload || {}
                    }, '*');
                } catch (e) {
                    console.warn('[PlayerWrapper] postMessage emit failed:', e);
                }
            }

            // Listen to commands from parent
            window.addEventListener('message', function(e) {
                if (!e.data || typeof e.data !== 'object') return;
                const { action, payload } = e.data;

                if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;

                switch (action) {
                    case 'PLAY':
                        try { ytPlayer.playVideo(); } catch (_) {}
                        break;
                    case 'PAUSE':
                        try { ytPlayer.pauseVideo(); } catch (_) {}
                        break;
                    case 'SEEK':
                        if (payload && typeof payload.seconds === 'number') {
                            try { ytPlayer.seekTo(payload.seconds, true); } catch (_) {}
                        }
                        break;
                    case 'MUTE':
                        try { ytPlayer.mute(); } catch (_) {}
                        break;
                    case 'UNMUTE':
                        try { ytPlayer.unMute(); } catch (_) {}
                        break;
                    case 'DESTROY':
                        cleanup();
                        break;
                }
            });

            function showFallbackError(code, customMessage) {
                loaderEl.classList.add('hidden');
                errorCardEl.classList.add('visible');

                if (code === 101 || code === 150) {
                    errorTitleEl.textContent = 'Ограничение правообладателя';
                    errorDescEl.textContent = 'Владелец видео запретил воспроизведение на сторонних сайтах (Error ' + code + '). Вы можете открыть его прямо на YouTube.';
                } else if (code === 100 || code === 2) {
                    errorTitleEl.textContent = 'Видео недоступно';
                    errorDescEl.textContent = 'Видео не найдено или было удалено с YouTube.';
                } else if (customMessage) {
                    errorDescEl.textContent = customMessage;
                }

                emitToParent('ERROR', { errorCode: code, message: errorDescEl.textContent });
            }

            function cleanup() {
                if (timeUpdateInterval) {
                    clearInterval(timeUpdateInterval);
                    timeUpdateInterval = null;
                }
                if (ytPlayer && typeof ytPlayer.destroy === 'function') {
                    try { ytPlayer.destroy(); } catch (_) {}
                    ytPlayer = null;
                }
            }

            window.addEventListener('beforeunload', cleanup);

            if (!videoId) {
                showFallbackError(2, 'Идентификатор видео не указан в запросе.');
                return;
            }

            // Load YouTube IFrame API
            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('player', {
                    videoId: videoId,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        autoplay: autoplay,
                        mute: mute,
                        start: startSec,
                        controls: controls,
                        rel: 0,
                        modestbranding: 1,
                        playsinline: 1,
                        enablejsapi: 1,
                        origin: window.location.origin
                    },
                    events: {
                        onReady: function(e) {
                            loaderEl.classList.add('hidden');
                            emitToParent('READY', {
                                duration: e.target.getDuration ? e.target.getDuration() : 0
                            });

                            // Setup periodic progress telemetry
                            timeUpdateInterval = setInterval(function() {
                                if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                                    const state = ytPlayer.getPlayerState();
                                    if (state === YT.PlayerState.PLAYING) {
                                        emitToParent('TIME_UPDATE', {
                                            currentTime: ytPlayer.getCurrentTime(),
                                            duration: ytPlayer.getDuration()
                                        });
                                    }
                                }
                            }, 1000);
                        },
                        onStateChange: function(e) {
                            const stateMap = {
                                [-1]: 'UNSTARTED',
                                [YT.PlayerState.ENDED]: 'ENDED',
                                [YT.PlayerState.PLAYING]: 'PLAYING',
                                [YT.PlayerState.PAUSED]: 'PAUSED',
                                [YT.PlayerState.BUFFERING]: 'BUFFERING',
                                [YT.PlayerState.CUED]: 'CUED'
                            };

                            const stateName = stateMap[e.data] || 'UNKNOWN';
                            emitToParent('STATE_CHANGE', {
                                state: stateName,
                                stateCode: e.data,
                                currentTime: ytPlayer && ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0
                            });
                        },
                        onError: function(e) {
                            showFallbackError(e.data);
                        }
                    }
                });
            };

            // Inject API script tag
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            tag.onerror = function() {
                showFallbackError(5, 'Не удалось загрузить YouTube IFrame API. Проверьте соединение.');
            };
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        })();
    </script>
</body>
</html>
