<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin-when-cross-origin">
    <title>StartTab Player Wrapper</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-elevated: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* controls=0: the host page draws its own player; YouTube's hover chrome
           (title, share, end screen links) must never receive the pointer. */
        .player-shield {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: transparent;
        }

        /* controls=0 still paints a title bar on top and «More videos», the share
           link and the logo at the bottom of the player box. The player is made
           taller than the visible frame: the picture stays centred and fills it,
           while those bars land in the cropped-off strips. */
        .chromeless #player-container {
            --crop: clamp(72px, 14vh, 140px);
            top: calc(-1 * var(--crop));
            height: calc(100% + 2 * var(--crop));
        }

        /* While not playing, YouTube paints its own pause UI over the frame (title,
           play button, «More videos») and the API cannot turn it off: the video's
           cover image hides it, like a movie poster. */
        .pause-cover {
            position: absolute;
            inset: 0;
            z-index: 2;
            background-color: #000;
            background-position: center;
            background-size: cover;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
        }

        .pause-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.28);
        }

        .pause-cover.visible {
            opacity: 1;
        }

        /* Loading Skeleton */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 2;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error & Fallback UI */
        .error-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            z-index: 3;
        }

        .error-card.visible {
            display: flex;
        }

        .error-card__backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .error-card__content {
            position: relative;
            z-index: 2;
            max-width: 440px;
            padding: 24px;
            text-align: center;
            background: rgba(24, 24, 27, 0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .error-card__icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card__title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .error-card__desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .error-card__btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--accent);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            margin-top: 4px;
        }

        .error-card__btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .error-card__btn:active {
            transform: translateY(0);
        }

        .error-card__btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loader Skeleton -->
        <div id="loader" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">Загрузка плеера...</div>
        </div>

        <!-- YouTube Player Container -->
        <div id="player-container">
            <div id="player"></div>
        </div>
        <div id="pause-cover" class="pause-cover"></div>
        <div id="player-shield" class="player-shield" hidden></div>

        <!-- Error / Blocked Embed Fallback -->
        <div id="error-card" class="error-card">
            <div class="error-card__backdrop"></div>
            <div class="error-card__content">
                <div class="error-card__icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
                <h3 id="error-title" class="error-card__title">Воспроизведение ограничено</h3>
                <p id="error-desc" class="error-card__desc">
                    Правообладатель отключил возможность воспроизведения этого видео на сторонних сайтах.
                </p>
                <a id="error-link" class="error-card__btn" href="#" target="_blank" rel="noopener noreferrer">
                    <span>Смотреть на YouTube</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6v2H5v11h11v-5h2v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6zm11-3v8h-2V5.414l-7.293 7.293-1.414-1.414L17.586 4H13V2h8a1 1 0 0 1 1 1z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v') || urlParams.get('video') || '';
            const autoplay = urlParams.get('autoplay') !== '0' ? 1 : 0;
            const mute = urlParams.get('mute') === '1' ? 1 : 0;
            const startSec = parseInt(urlParams.get('t') || urlParams.get('start') || '0', 10) || 0;
            const controls = urlParams.get('controls') !== '0' ? 1 : 0;
            // probe=1: load without playing, report duration / live / errors, nothing else.
            const probe = urlParams.get('probe') === '1';
            const initialVolume = Number(urlParams.get('volume'));
            const pauseCoverEl = document.getElementById('pause-cover');
            let coverTimer = null;
            if (!controls) {
                document.getElementById('player-shield').hidden = false;
                document.body.classList.add('chromeless');
                // Not playing yet: show the cover from the start. maxresdefault is
                // missing for some videos (YouTube answers 404), so fall back.
                pauseCoverEl.classList.add('visible');
                const cover = new Image();
                const base = 'https://i.ytimg.com/vi/' + encodeURIComponent(videoId) + '/';
                cover.onload = function() { pauseCoverEl.style.backgroundImage = 'url("' + cover.src + '")'; };
                cover.onerror = function() { pauseCoverEl.style.backgroundImage = 'url("' + base + 'hqdefault.jpg")'; };
                cover.src = base + 'maxresdefault.jpg';
            }

            const loaderEl = document.getElementById('loader');
            const errorCardEl = document.getElementById('error-card');
            const errorTitleEl = document.getElementById('error-title');
            const errorDescEl = document.getElementById('error-desc');
            const errorLinkEl = document.getElementById('error-link');

            let ytPlayer = null;
            let timeUpdateInterval = null;
            let lastReportedTime = startSec;
            let lastPlayReportAt = 0;
            // Captions (IFrame API «captions» module): the host lists YouTube's
            // tracks in its own menu and picks one; null keeps them off.
            let captionChoice = null;
            let captionsProbed = false;
            let lastCaptionsKey = '';

            function reportCaptions() {
                if (!ytPlayer || typeof ytPlayer.getOption !== 'function') return;
                let list = [];
                try { list = ytPlayer.getOption('captions', 'tracklist') || []; } catch (_) { return; }
                if (!list.length) return;
                const tracks = list.map(function(track) {
                    return {
                        languageCode: String(track.languageCode || ''),
                        displayName: String(track.displayName || track.languageName || track.languageCode || ''),
                        kind: String(track.kind || '')
                    };
                }).filter(function(track) { return track.languageCode; });
                const key = JSON.stringify(tracks);
                if (key !== lastCaptionsKey) {
                    lastCaptionsKey = key;
                    emitToParent('CAPTIONS', { tracks: tracks, active: captionChoice });
                }
                if (!captionChoice) {
                    // The list was only loaded to be offered: keep captions off.
                    try { ytPlayer.unloadModule('captions'); } catch (_) {}
                    return;
                }
                let current = null;
                try { current = (ytPlayer.getOption('captions', 'track') || {}).languageCode || null; } catch (_) {}
                if (current !== captionChoice) {
                    try { ytPlayer.setOption('captions', 'track', { languageCode: captionChoice }); } catch (_) {}
                }
            }

            // YouTube pins captions to the bottom of its box, inside the cropped
            // strip: show the whole box while they are on. Off is unloadModule
            // (an empty track leaves YouTube unable to draw them again), and the
            // box is resized only after the module is back, or nothing is drawn.
            let captionLayoutTimer = null;
            function applyCaptions() {
                clearTimeout(captionLayoutTimer);
                if (!captionChoice) {
                    try { ytPlayer.unloadModule('captions'); } catch (_) {}
                    if (!controls) document.body.classList.add('chromeless');
                    return;
                }
                try { ytPlayer.loadModule('captions'); } catch (_) {}
                try { ytPlayer.setOption('captions', 'track', { languageCode: captionChoice }); } catch (_) {}
                if (!controls) {
                    captionLayoutTimer = setTimeout(function() { document.body.classList.remove('chromeless'); }, 1500);
                }
            }

            // Set direct YouTube watch link
            if (videoId) {
                errorLinkEl.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
                errorCardEl.style.backgroundImage = `url(https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg)`;
            }

            // Communication Bridge: Send message to parent (Chrome Extension)
            function emitToParent(event, payload) {
                try {
                    window.parent.postMessage({
                        source: 'STARTTAB_PLAYER_WRAPPER',
                        event: event,
                        videoId: videoId,
                        payload: payload || {}
                    }, '*');
                } catch (e) {
                    console.warn('[PlayerWrapper] postMessage emit failed:', e);
                }
            }

            // Listen to commands from parent
            window.addEventListener('message', function(e) {
                if (!e.data || typeof e.data !== 'object') return;
                const { action, payload } = e.data;

                if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;

                switch (action) {
                    case 'PLAY':
                        try { ytPlayer.playVideo(); } catch (_) {}
                        break;
                    case 'PAUSE':
                        try { ytPlayer.pauseVideo(); } catch (_) {}
                        break;
                    case 'SEEK':
                        if (payload && typeof payload.seconds === 'number') {
                            lastReportedTime = payload.seconds;
                            try { ytPlayer.seekTo(payload.seconds, true); } catch (_) {}
                        }
                        break;
                    case 'MUTE':
                        try { ytPlayer.mute(); } catch (_) {}
                        break;
                    case 'UNMUTE':
                        try { ytPlayer.unMute(); } catch (_) {}
                        break;
                    case 'SET_RATE':
                        if (payload && typeof payload.rate === 'number') {
                            try { ytPlayer.setPlaybackRate(payload.rate); } catch (_) {}
                        }
                        break;
                    case 'SET_VOLUME':
                        if (payload && typeof payload.volume === 'number') {
                            try { ytPlayer.setVolume(Math.max(0, Math.min(100, Math.round(payload.volume)))); } catch (_) {}
                        }
                        break;
                    case 'SET_CAPTIONS':
                        captionChoice = payload && typeof payload.languageCode === 'string' && payload.languageCode
                            ? payload.languageCode : null;
                        applyCaptions();
                        break;
                    case 'DESTROY':
                        cleanup();
                        break;
                }
            });

            function showFallbackError(code, customMessage) {
                loaderEl.classList.add('hidden');
                errorCardEl.classList.add('visible');

                if (code === 101 || code === 150) {
                    errorTitleEl.textContent = 'Ограничение правообладателя';
                    errorDescEl.textContent = 'Владелец видео запретил воспроизведение на сторонних сайтах (Error ' + code + '). Вы можете открыть его прямо на YouTube.';
                } else if (code === 100 || code === 2) {
                    errorTitleEl.textContent = 'Видео недоступно';
                    errorDescEl.textContent = 'Видео не найдено или было удалено с YouTube.';
                } else if (customMessage) {
                    errorDescEl.textContent = customMessage;
                }

                emitToParent('ERROR', { errorCode: code, message: errorDescEl.textContent });
            }

            function cleanup() {
                if (timeUpdateInterval) {
                    clearInterval(timeUpdateInterval);
                    timeUpdateInterval = null;
                }
                if (ytPlayer && typeof ytPlayer.destroy === 'function') {
                    try { ytPlayer.destroy(); } catch (_) {}
                    ytPlayer = null;
                }
            }

            window.addEventListener('beforeunload', cleanup);

            if (!videoId) {
                showFallbackError(2, 'Идентификатор видео не указан в запросе.');
                return;
            }

            // getVideoData().isLive is undocumented and stays false while a stream is
            // only cued; such a stream then reports a huge getDuration() instead.
            // Regular uploads are capped at 12 hours.
            const MAX_UPLOAD_SEC = 12 * 3600;
            function isLiveVideo(player) {
                try {
                    if (player.getVideoData && player.getVideoData().isLive) return true;
                    return Boolean(player.getDuration && player.getDuration() > MAX_UPLOAD_SEC);
                } catch (_) { return false; }
            }

            // Load YouTube IFrame API
            window.onYouTubeIframeAPIReady = function() {
                const stateMap = {
                    [-1]: 'UNSTARTED',
                    [YT.PlayerState.ENDED]: 'ENDED',
                    [YT.PlayerState.PLAYING]: 'PLAYING',
                    [YT.PlayerState.PAUSED]: 'PAUSED',
                    [YT.PlayerState.BUFFERING]: 'BUFFERING',
                    [YT.PlayerState.CUED]: 'CUED'
                };

                ytPlayer = new YT.Player('player', {
                    videoId: videoId,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        autoplay: probe ? 0 : autoplay,
                        mute: probe ? 1 : mute,
                        start: startSec,
                        controls: controls,
                        disablekb: controls ? 0 : 1,
                        fs: controls,
                        iv_load_policy: 3,
                        rel: 0,
                        modestbranding: 1,
                        playsinline: 1,
                        enablejsapi: 1,
                        origin: window.location.origin
                    },
                    events: {
                        onReady: function(e) {
                            loaderEl.classList.add('hidden');
                            if (!probe && Number.isFinite(initialVolume) && initialVolume >= 0 && initialVolume <= 100) {
                                try { e.target.setVolume(Math.round(initialVolume)); } catch (_) {}
                            }
                            emitToParent('READY', {
                                duration: e.target.getDuration ? e.target.getDuration() : 0,
                                isLive: isLiveVideo(e.target)
                            });
                            // A cued video often reports duration 0 until metadata arrives.
                            if (probe) {
                                let tries = 0;
                                const probeTimer = setInterval(function() {
                                    tries += 1;
                                    const duration = ytPlayer && ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
                                    const live = ytPlayer ? isLiveVideo(ytPlayer) : false;
                                    if (duration > 0 || live || tries >= 20) {
                                        clearInterval(probeTimer);
                                        emitToParent('PROBE', { duration: duration, isLive: live });
                                    }
                                }, 250);
                                return;
                            }

                            // Setup periodic progress telemetry (including paused scrub detection)
                            timeUpdateInterval = setInterval(function() {
                                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
                                const state = ytPlayer.getPlayerState();
                                const currentTime = ytPlayer.getCurrentTime();
                                const duration = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
                                const now = Date.now();
                                if (state === YT.PlayerState.PLAYING && now - lastPlayReportAt >= 950) {
                                    lastPlayReportAt = now;
                                    lastReportedTime = currentTime;
                                    emitToParent('TIME_UPDATE', {
                                        currentTime: currentTime,
                                        duration: duration,
                                        loaded: ytPlayer.getVideoLoadedFraction ? ytPlayer.getVideoLoadedFraction() : 0,
                                        state: 'PLAYING'
                                    });
                                } else if (
                                    (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED)
                                    && Number.isFinite(currentTime)
                                    && Math.abs(currentTime - lastReportedTime) > 0.5
                                ) {
                                    lastReportedTime = currentTime;
                                    emitToParent('TIME_UPDATE', {
                                        currentTime: currentTime,
                                        duration: duration,
                                        state: stateMap[state] || 'PAUSED'
                                    });
                                }
                            }, 500);
                        },
                        onApiChange: function() {
                            reportCaptions();
                        },
                        onStateChange: function(e) {
                            // The track list exists only once playback has begun.
                            if (e.data === YT.PlayerState.PLAYING && !captionsProbed && !probe) {
                                captionsProbed = true;
                                try { ytPlayer.loadModule('captions'); } catch (_) {}
                                setTimeout(reportCaptions, 1500);
                            }
                            const stateName = stateMap[e.data] || 'UNKNOWN';
                            if (!controls && stateName !== 'BUFFERING') {
                                clearTimeout(coverTimer);
                                if (stateName === 'PLAYING') {
                                    // Outlast YouTube's play/pause flash in the centre.
                                    coverTimer = setTimeout(function() { pauseCoverEl.classList.remove('visible'); }, 600);
                                } else {
                                    pauseCoverEl.classList.add('visible');
                                }
                            }
                            const currentTime = ytPlayer && ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
                            if (Number.isFinite(currentTime)) {
                                lastReportedTime = currentTime;
                            }
                            emitToParent('STATE_CHANGE', {
                                state: stateName,
                                stateCode: e.data,
                                currentTime: currentTime,
                                duration: ytPlayer && ytPlayer.getDuration ? ytPlayer.getDuration() : 0,
                                isLive: ytPlayer ? isLiveVideo(ytPlayer) : false
                            });
                        },
                        onError: function(e) {
                            showFallbackError(e.data);
                        }
                    }
                });
            };

            // Inject API script tag
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            tag.onerror = function() {
                showFallbackError(5, 'Не удалось загрузить YouTube IFrame API. Проверьте соединение.');
            };
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        })();
    </script>
</body>
</html>
