name: Build and publish extension release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'

permissions:
  contents: write

concurrency:
  group: extension-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Run updater contract tests
        run: npm run test:random-marathon && npm run test:update-service && npm run test:package-release && npm run test-popup-surface-contract && npm run test:updater-setup && node tests/updateMirror.test.cjs

      - name: Build and package extension
        run: npm run package-release

      - name: Verify native directory replacement
        run: dotnet run --project native-host/Updater.Tests/Updater.Tests.csproj --configuration Release

      - name: Create signed update metadata
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: node scripts/generate-update-metadata.js

      - name: Validate Firebase deployment credentials
        shell: pwsh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT)) {
            throw 'Missing required GitHub Actions secret FIREBASE_SERVICE_ACCOUNT. Add the complete Firebase service-account JSON in repository Settings > Secrets and variables > Actions.'
          }
          try {
            $credentials = $env:FIREBASE_SERVICE_ACCOUNT | ConvertFrom-Json
          } catch {
            throw 'FIREBASE_SERVICE_ACCOUNT is not valid JSON.'
          }
          if ([string]::IsNullOrWhiteSpace($credentials.project_id) -or
              [string]::IsNullOrWhiteSpace($credentials.client_email) -or
              [string]::IsNullOrWhiteSpace($credentials.private_key)) {
            throw 'FIREBASE_SERVICE_ACCOUNT must contain project_id, client_email, and private_key.'
          }

      - name: Create draft release with all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingReleaseJson = gh release view $env:GITHUB_REF_NAME --json isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $existingReleaseJson | ConvertFrom-Json
            if ($existingRelease.isDraft -ne $true -or $existingRelease.isPrerelease -eq $true) {
              throw 'A published or prerelease with this tag already exists; refuse to replace it.'
            }
            Write-Host "Resuming existing draft release $env:GITHUB_REF_NAME."
          } else {
            gh release create $env:GITHUB_REF_NAME `
              --verify-tag `
              --draft `
              --title "MovieList Extension $env:GITHUB_REF_NAME" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft GitHub release.' }
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release upload $env:GITHUB_REF_NAME `
            --clobber `
            "MovieList-extension-$version.zip" "MovieListSetup.exe" "update.json" "update.json.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets to GitHub.' }

      - name: Authenticate Firebase deployment
        id: firebase-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token

      - name: Prepare latest mirror and reject older versions
        run: node scripts/update-mirror.cjs prepare

      - name: Publish latest extension ZIP to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --config firebase.updates.json --project movielistdb-13208 --non-interactive

      - name: Verify mirror and remove previous archives
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        run: node scripts/update-mirror.cjs verify-cleanup

      - name: Publish release after asset upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false

      - name: Mark the newest release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --latest
