name: Build and publish extension release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Run updater contract tests
        run: npm run test:update-service && npm run test:package-release && npm run test-popup-surface-contract && npm run test:updater-setup

      - name: Build and package extension
        run: npm run package-release

      - name: Verify native directory replacement
        run: dotnet run --project native-host/Updater.Tests/Updater.Tests.csproj --configuration Release

      - name: Create signed update metadata
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: node scripts/generate-update-metadata.js

      - name: Create draft release with all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingRelease = gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:GITHUB_REF_NAME --yes
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            --verify-tag `
            --draft `
            --title "MovieList Extension $env:GITHUB_REF_NAME" `
            --generate-notes `
            "MovieList-extension-$version.zip" "MovieListSetup.exe" "update.json" "update.json.sig"

      - name: Publish release after asset upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false

      - name: Mark the newest release as latest
        if: github.ref_name == 'v1.3.1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --latest
