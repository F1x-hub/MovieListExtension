name: Offline player source health

# No schedule or live credentials: publishing and operational monitoring are separate gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production decoder and fixture media containers
        run: npm run test:player-health
